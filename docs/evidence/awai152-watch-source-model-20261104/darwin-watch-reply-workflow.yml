name: darwin-watch-reply
on:
  pull_request:
    paths:
      - 'seed/darwin-watch-reply.kotoba'
      - 'seed/tests/awai152-darwin-watch/reply-cases.kotoba'
      - 'scripts/seed/check-darwin-watch-reply.py'
      - '.github/workflows/darwin-watch-reply.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reply-cases:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run native classifier and negative control
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          python3 scripts/seed/native_build_queue.py -- python3 scripts/seed/check-darwin-watch-reply.py --output "$RUNNER_TEMP/darwin-watch-reply"

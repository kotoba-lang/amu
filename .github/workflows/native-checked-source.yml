name: native-checked-source
# This is a bounded identity bridge, not whole-compiler cache admission.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "seed/**"
      - "bin/amu"
      - "native-product.json"
      - "scripts/seed/check-checked-source-native.py"
      - "scripts/seed/check-definition-effects-native.py"
      - "scripts/seed/check-identity-resource-native.py"
      - "scripts/seed/check-source-vectors-native.py"
      - "scripts/seed/check-source-namespace-native.py"
      - ".github/workflows/native-checked-source.yml"
  push:
    branches: [main]
    paths:
      - "seed/**"
      - "bin/amu"
      - "native-product.json"
      - "scripts/seed/check-checked-source-native.py"
      - "scripts/seed/check-definition-effects-native.py"
      - "scripts/seed/check-identity-resource-native.py"
      - "scripts/seed/check-source-vectors-native.py"
      - "scripts/seed/check-source-namespace-native.py"
      - ".github/workflows/native-checked-source.yml"
permissions:
  contents: read
concurrency:
  group: native-checked-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            isa: arm64
            compiler: seed/bootstrap/aarch64-linux-static-root.elf
          - runner: ubuntu-latest
            isa: x86_64
            compiler: bin/amu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify adopted compiler source and image pins
        run: python3 scripts/seed/check-native-identities.py
      - name: Stage independent source identity gate plan
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          NATIVE_COMPILER: ${{ matrix.compiler }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          compiler = str(Path.cwd() / os.environ["NATIVE_COMPILER"])
          # Admit the longest derivation first. These independent observers
          # use separate fixture/cache directories and retain every control.
          gates = [
              ("checked-source", "check-checked-source-native.py", "checked-source"),
              ("source-vectors", "check-source-vectors-native.py", "source-vectors"),
              ("identity-resource", "check-identity-resource-native.py", "identity-resource"),
              ("definition-effects", "check-definition-effects-native.py", "definition-effects"),
          ]
          rows = [dict(name=name, argv=["python3", "scripts/seed/" + script,
                  "--compiler", compiler, "--output", "@TEMP@/" + output])
                  for name, script, output in gates]
          plan = dict(schema="amu.native-gate-plan.v1", phases={"source-identity": rows})
          (Path(os.environ["RUNNER_TEMP"]) / "source-identity-plan.json").write_text(json.dumps(plan) + "\n")
          PY
      - name: Native source, effect and resource controls through the shared two-slot plan
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 scripts/seed/native_build_queue.py
          --manifest "$RUNNER_TEMP/source-identity-plan.json"
          --phase source-identity --jobs 2
          --slot-dir "$RUNNER_TEMP/native-build-slots"
          --output "$RUNNER_TEMP/source-identity-schedule"
      - name: Retain completed gate admission records
        if: always()
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          schedule = root / "source-identity-schedule/schedule.json"
          if schedule.exists():
              report = json.loads(schedule.read_text())
              assert report["jobs"] == report["capacity"] == 2
              names = {"checked-source": "source-admission.json",
                       "identity-resource": "identity-resource-admission.json",
                       "definition-effects": "effects-admission.json",
                       "source-vectors": "source-vectors-admission.json"}
              for gate in report["gates"]:
                  admission = dict(schema="amu.native-build-admission.v1", **gate)
                  (root / names[gate["name"]]).write_text(json.dumps(admission) + "\n")
              if report["status"] == "COMPLETED":
                  assert {gate["name"] for gate in report["gates"]} == set(names)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-checked-source-${{ matrix.isa }}
          path: |
            ${{ runner.temp }}/checked-source
            ${{ runner.temp }}/source-admission.json
            ${{ runner.temp }}/definition-effects
            ${{ runner.temp }}/effects-admission.json
            ${{ runner.temp }}/identity-resource
            ${{ runner.temp }}/identity-resource-admission.json
            ${{ runner.temp }}/source-vectors
            ${{ runner.temp }}/source-vectors-admission.json
            ${{ runner.temp }}/source-identity-plan.json
            ${{ runner.temp }}/source-identity-schedule
          if-no-files-found: error

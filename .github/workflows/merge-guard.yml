name: merge-guard
on:
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  merge-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The guard reads the full branch line: the PR's own commits, the
          # merges that brought main into it, and the base history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.12.0"
      - name: Merge-side deletion, revert-of-main-merge and mass-deletion guard
        run: node scripts/merge-guard.mjs
        env:
          MERGE_GUARD_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_GUARD_HEAD: ${{ github.event.pull_request.head.sha }}
          # Advisory: reports findings and never blocks a merge, so refactor
          # flows (mass rewrites, repeated main merges) are not held up. Flip
          # to "fail" here, in a reviewed commit, to gate merges instead.
          MERGE_GUARD_MODE: warn

name: native-checked-definition
# Independent producer qualification; it does not replace any selfhost gate
# or admit these prototype modules into the production compiler closure.
on:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  pull_request:
    paths:
      - "seed/**"
      - "bin/amu-linux-x86_64"
      - "scripts/seed/check-checked-definition-native.py"
      - "scripts/seed/check-schema-closure-native.cljc"
      - ".github/workflows/native-checked-definition.yml"
  push:
    branches: [main]
    paths:
      - "seed/**"
      - "bin/amu-linux-x86_64"
      - "scripts/seed/check-checked-definition-native.py"
      - "scripts/seed/check-schema-closure-native.cljc"
      - ".github/workflows/native-checked-definition.yml"
permissions:
  contents: read
concurrency:
  group: native-checked-definition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  producer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            isa: arm64
            compiler: seed/bootstrap/aarch64-linux-static-root.elf
          - runner: ubuntu-24.04
            isa: x86_64
            compiler: bin/amu-linux-x86_64
    runs-on: ${{ matrix.runner == 'ubuntu-24.04-arm' && (contains(fromJSON('["selfhosted","selfhosted-arm"]'), vars.AMU_RUNNER_PROFILE) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'amu-linux-arm64' || matrix.runner) || (vars.AMU_RUNNER_PROFILE == 'selfhosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'amu-linux-x86_64' || matrix.runner) }}  # amu-runner: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: gate
        uses: ./.github/actions/ci-gate
        with:
          job: native-checked-definition-producer-${{ matrix.runner }}
      - name: Verify adopted source and compiler pins
        if: steps.gate.outputs.skip != 'true'
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts/seed basilisp run scripts/seed/check-native-identities.cljc --
      - name: Native checking, alpha normalization, SCC oracle and executed mutants
        if: steps.gate.outputs.skip != 'true'
        run: >-
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts/seed basilisp run scripts/seed/native_build_queue.cljc --
          --slot-dir "$RUNNER_TEMP/native-build-slots" --
          python3 scripts/seed/check-checked-definition-native.py
          --compiler "$PWD/${{ matrix.compiler }}"
          --output "$RUNNER_TEMP/checked-definition"
          --benchmark-scc
      - name: Native record-schema closure and executed mutants
        if: steps.gate.outputs.skip != 'true'
        run: >-
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts/seed basilisp run scripts/seed/native_build_queue.cljc --
          --slot-dir "$RUNNER_TEMP/native-build-slots" --
          basilisp run -p scripts/seed scripts/seed/check-schema-closure-native.cljc --
          --compiler "$PWD/${{ matrix.compiler }}"
          --output "$RUNNER_TEMP/schema-closure"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.gate.outputs.skip != 'true'
        with:
          name: checked-definition-${{ matrix.isa }}
          path: ${{ runner.temp }}/checked-definition
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.gate.outputs.skip != 'true'
        with:
          name: schema-closure-${{ matrix.isa }}
          path: ${{ runner.temp }}/schema-closure
          if-no-files-found: warn
      - if: success() && steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/ci-save
        with:
          key: ${{ steps.gate.outputs.key }}

name: browser-matrix
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.12.0"
          cache: npm
      - run: npm ci
      - run: npm run test-windows-profile
        if: runner.os == 'Windows'
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit chrome msedge chrome-beta msedge-beta
        if: runner.os == 'Linux'
      - run: node node_modules/@playwright/test/cli.js install chromium firefox webkit chrome msedge chrome-beta msedge-beta
        if: runner.os == 'Windows'
      - run: npm run test-browsers
        env:
          KOTOBA_BRANDED_BROWSERS: "1"
          # chrome-beta/msedge-beta: forward-looking pre-stable channel signal, not a
          # previous-version pin -- see playwright.config.mjs.
          KOTOBA_BETA_BROWSERS: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: browser-evidence-${{ runner.os }}
          path: test-results/browser-evidence.json
          if-no-files-found: error
          retention-days: 30
  safari:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.12.0"
          cache: npm
      - run: npm ci
      - run: sudo safaridriver --enable
      - run: npm run test-safari
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: browser-evidence-Safari
          path: test-results/browser-evidence.json
          if-no-files-found: error
          retention-days: 30

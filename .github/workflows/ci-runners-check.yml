name: ci-runners-check
on:
  pull_request:
    paths:
      - "scripts/ci-runners/**"
      - ".github/workflows/**"
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  runs-on-template:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          python3 -m venv "$RUNNER_TEMP/basilisp-venv"
          "$RUNNER_TEMP/basilisp-venv/bin/pip" install --quiet basilisp==0.5.1 pytest
          echo "$RUNNER_TEMP/basilisp-venv/bin" >> "$GITHUB_PATH"
      - run: basilisp run scripts/ci-runners/runs_on.cljc -- --check
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts/ci-runners basilisp test -p no:cacheprovider --rootdir scripts/ci-runners scripts/ci-runners/test_runs_on.cljc scripts/ci-runners/test_capacity.cljc

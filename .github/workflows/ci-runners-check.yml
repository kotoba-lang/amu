name: ci-runners-check
on:
  pull_request:
    paths:
      - "scripts/ci-runners/**"
      - ".github/workflows/**"
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  runs-on-template:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -I scripts/ci-runners/runs_on.py --check
      - run: python3 -I scripts/ci-runners/test_runs_on.py
      - run: python3 -I scripts/ci-runners/test_capacity.py

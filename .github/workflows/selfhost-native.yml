name: selfhost-native
# Loaderless Amu selfhost on native kernels (no C compiler or loader, no
# emulation): the pinned Amu-produced root bootstraps on arm64 Linux, and the
# x86_64 compiler and KX64V1 runner it builds are qualified on x86_64 Linux.
# Python only orchestrates processes and hashes.
#
# Tiers (scripts/seed/selfhost-bootstrap.py --tier; every check runs in one):
#   pull_request -> pr:   the root F rebuilds itself, F's targets, F's core route
#                         (the adoption image), boundary corpus, cases,
#                         hardening, capabilities, the cases as wasm32-browser
#                         modules; x86_64: X2, cases, hardening, and the
#                         wasm32-browser modules in headless Chrome (JUN-353:
#                         the arm64 image has no Chrome or Chromium).
#   push to main -> main: + G2/G3 through the runner, the packed core P, the
#                         Linux selfhost closure fixed point; x86_64: X3, the
#                         KX64V1 runner, the scalar and aiueos suites.
#   schedule, workflow_dispatch -> full: + the deep provenance from source
#                         (C0 -> the adoption image; C0 -> Kw -> Pw -> F).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "bin/amu"
      - "bin/kotoba"
      - "bin/kotoba-compiler"
      - "native-product.json"
      - "seed/**"
      - "scripts/seed/**"
      - "tools/gpu_*.kotoba"
      - "tools/spirv_*.kotoba"
      - "tools/static_launcher*.kotoba"
      - "runtime/wasm32-browser-static-*"
      - ".github/workflows/selfhost-native.yml"
  pull_request:
    branches: [main]
    paths:
      - "bin/amu"
      - "bin/kotoba"
      - "bin/kotoba-compiler"
      - "native-product.json"
      - "seed/**"
      - "scripts/seed/**"
      - "tools/gpu_*.kotoba"
      - "tools/spirv_*.kotoba"
      - "tools/static_launcher*.kotoba"
      - "runtime/wasm32-browser-static-*"
      - ".github/workflows/selfhost-native.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer PR push supersedes the old run; full runs on main queue instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  bootstrap-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Loaderless bootstrap from the pinned root (arm64, native)
        env:
          TIER: ${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'push' && 'main' || 'full' }}
        run: python3 scripts/seed/selfhost-bootstrap.py --output "$RUNNER_TEMP/boot" --tier "$TIER"
      - name: Static launcher (--format launcher, ADR 0371 step 4; arm64, native)
        run: python3 scripts/seed/check-static-launcher.py --compiler "$RUNNER_TEMP/boot/F1.elf" --output "$RUNNER_TEMP/launcher"
      - name: Kototama bounded pure i64 AOT (arm64, native verdict)
        run: python3 scripts/seed/check-kototama-i64.py --compiler "$RUNNER_TEMP/boot/F1.elf" --output "$RUNNER_TEMP/kototama-i64-arm64"
      - name: Combined compiler (core + Linux targets) from the bootstrap (arm64, native)
        run: python3 scripts/seed/check-one-compiler.py --bootstrap "$RUNNER_TEMP/boot" --output "$RUNNER_TEMP/one"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: one-compiler-receipt
          path: |
            ${{ runner.temp }}/one/one-compiler.json
            ${{ runner.temp }}/one/calls.json
            ${{ runner.temp }}/one/F2.elf
            ${{ runner.temp }}/one/F-x86_64.elf
          if-no-files-found: warn
      # Keep the transported compiler files at the artifact root. Adding the
      # sibling AOT directory above changes upload-artifact's common ancestor.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kototama-i64-arm64
          path: |
            ${{ runner.temp }}/kototama-i64-arm64/report.json
            ${{ runner.temp }}/kototama-i64-arm64/gate.stdout
            ${{ runner.temp }}/kototama-i64-arm64/gate.stderr
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-arm64
          path: |
            ${{ runner.temp }}/boot/selfhost-bootstrap.json
            ${{ runner.temp }}/boot/runtime-boundary/runtime-boundary.json
            ${{ runner.temp }}/boot/runtime-boundary/calls.json
            ${{ runner.temp }}/boot/calls.json
            ${{ runner.temp }}/boot/S-x86_64.elf
            ${{ runner.temp }}/boot/R-x86_64.elf
            ${{ runner.temp }}/boot/selfhost-unity.kotoba
            ${{ runner.temp }}/boot/wasm32/*.wasm
          if-no-files-found: error
      # a separate artifact: another path in the one above would move its root
      # (the qualify job expects boot/ at the top)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-launcher-arm64
          path: ${{ runner.temp }}/launcher/static-launcher.json
          if-no-files-found: error
  qualify-x86_64:
    needs: bootstrap-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootstrap-arm64
          path: ${{ runner.temp }}/boot
      - name: Native x86_64 qualification (no loader, no emulation)
        env:
          TIER: ${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'push' && 'main' || 'full' }}
        run: python3 scripts/seed/check-x86_64-native.py --bootstrap "$RUNNER_TEMP/boot" --output "$RUNNER_TEMP/x86" --tier "$TIER"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: one-compiler-receipt
          path: ${{ runner.temp }}/one
      - name: Complete native x86 compiler fixed point and CDCI images
        run: python3 scripts/seed/check-complete-x86.py --compiler "$RUNNER_TEMP/one/F-x86_64.elf" --arm-proof "$RUNNER_TEMP/one/one-compiler.json" --output "$RUNNER_TEMP/complete"
      - name: Native x86 AIUEOS image ABI and refusal diagnostics
        run: python3 scripts/seed/check-aiueos-image-native.py --complete "$RUNNER_TEMP/complete" --output "$RUNNER_TEMP/aiueos-image"
      - name: Native x86 AIUEOS EFI packaging and refusal diagnostics
        run: python3 scripts/seed/check-aiueos-boot-native.py --complete "$RUNNER_TEMP/complete" --output "$RUNNER_TEMP/aiueos-boot"
      - name: Native x86 locked kernel graph, DMA contracts and private PCI diagnostics
        shell: bash
        run: |
          for suite in project cpu-project memory-project regions boot-region lock isr fixed-extent owned-page owned-window private-context pci-boot pci-private pci-forgery; do
            python3 "scripts/seed/check-aiueos-$suite-native.py" --complete "$RUNNER_TEMP/complete" --output "$RUNNER_TEMP/aiueos-projects/$suite"
          done
      - name: Native x86 kernel memory admission and emitted guard diagnostics
        shell: bash
        run: |
          python3 scripts/seed/check-kernel-memory.py --compiler "$RUNNER_TEMP/complete/F2.elf" --work "$RUNNER_TEMP/kernel-memory-admission" --cases seed/tests/kernel-memory | tee "$RUNNER_TEMP/kernel-memory-admission.log"
          python3 scripts/seed/check-kernel-memory.py --compiler "$RUNNER_TEMP/complete/F2.elf" --work "$RUNNER_TEMP/kernel-memory-guards" | tee "$RUNNER_TEMP/kernel-memory-guards.log"
      - name: Kototama bounded pure i64 AOT (x86_64, native verdict)
        run: python3 scripts/seed/check-kototama-i64.py --compiler "$RUNNER_TEMP/complete/F2.elf" --output "$RUNNER_TEMP/kototama-i64-x86_64"
      - name: Native x86 clock and entropy (fixed Kotoba guest, refusal and ENOSYS)
        run: python3 scripts/seed/check-native-clock-entropy.py --compiler "$RUNNER_TEMP/complete/F2.elf" --output "$RUNNER_TEMP/clock-entropy"
      - name: Kotoba native controller (Amu selfhost and complete24 Kotoba gate)
        run: python3 scripts/seed/check-native-cdci.py --complete "$RUNNER_TEMP/complete" --output "$RUNNER_TEMP/native-cdci"
      - name: Public native product and aliases
        run: python3 scripts/seed/check-public-native-product.py --product "$GITHUB_WORKSPACE" --complete "$RUNNER_TEMP/complete" --output "$RUNNER_TEMP/public-product"
      # JUN-353: F's wasm32-browser modules of the runtime cases, in the image's
      # Chrome (static page, Worker host, DevTools protocol on a pipe; no Node)
      - name: wasm32-browser cases in headless Chrome
        run: python3 scripts/seed/check-wasm32-browser.py --modules "$RUNNER_TEMP/boot/wasm32" --output "$RUNNER_TEMP/x86/wasm32-browser" --browser google-chrome
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: x86_64-native-receipt
          path: |
            ${{ runner.temp }}/x86/x86_64-native.json
            ${{ runner.temp }}/x86/check-static-launcher/static-launcher.json
            ${{ runner.temp }}/x86/runtime-boundary/runtime-boundary.json
            ${{ runner.temp }}/x86/runtime-boundary/calls.json
            ${{ runner.temp }}/x86/raw
            ${{ runner.temp }}/public-product/public-product.json
            ${{ runner.temp }}/complete/complete-x86.json
            ${{ runner.temp }}/complete/calls.json
            ${{ runner.temp }}/complete/F1.elf
            ${{ runner.temp }}/complete/F2.elf
            ${{ runner.temp }}/complete/F3.elf
            ${{ runner.temp }}/kernel-memory-admission.log
            ${{ runner.temp }}/kernel-memory-guards.log
            ${{ runner.temp }}/aiueos-image/native-image.json
            ${{ runner.temp }}/aiueos-image/F2/commands.json
            ${{ runner.temp }}/aiueos-image/F3/commands.json
            ${{ runner.temp }}/aiueos-boot/native-boot.json
            ${{ runner.temp }}/aiueos-boot/F2/commands.json
            ${{ runner.temp }}/aiueos-boot/F3/commands.json
            ${{ runner.temp }}/aiueos-projects/**/*.json
            ${{ runner.temp }}/kototama-i64-x86_64/report.json
            ${{ runner.temp }}/kototama-i64-x86_64/gate.stdout
            ${{ runner.temp }}/kototama-i64-x86_64/gate.stderr
            ${{ runner.temp }}/clock-entropy/native-clock-entropy.json
            ${{ runner.temp }}/clock-entropy/calls.json
            ${{ runner.temp }}/clock-entropy/enosys-filter.json
            ${{ runner.temp }}/native-cdci/native-cdci.json
            ${{ runner.temp }}/native-cdci/calls.json
            ${{ runner.temp }}/native-cdci/raw
            ${{ runner.temp }}/native-cdci/positive/cdci.receipt
            ${{ runner.temp }}/native-cdci/positive/kotoba-gate.receipt
            ${{ runner.temp }}/x86/wasm32-browser/wasm32-browser.json
          if-no-files-found: warn

  qualify-x86_64:
    needs: qualify-x86-shards
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-scheduling-x86
          path: ${{ runner.temp }}/x86-shards/core
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-scheduling-x86-extensions
          path: ${{ runner.temp }}/x86-shards/extensions
      - name: Require all17 original native gates and argv at capacity2 per runner
        run: python3 scripts/seed/native_gate_shard.py --manifest seed/native-gate-plan.json --verify-root "$RUNNER_TEMP/x86-shards" --output "$RUNNER_TEMP/x86-partition-review.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-x86-partition-review
          path: ${{ runner.temp }}/x86-partition-review.json
          if-no-files-found: warn

  qualify-benchmark-x86-factory:
    needs: [qualify-benchmark-arm, derive-x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-x86-derivation
          path: ${{ runner.temp }}/native-proof
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-benchmark-arm-host-reference
          path: ${{ runner.temp }}/arm-host-reference
      - name: Stage original19 through the actual fixed-point public x86 compiler
        run: |
          chmod 700 "$RUNNER_TEMP/native-proof/complete/F3.elf"
          python3 scripts/seed/native_build_queue.py --jobs 1 --output "$RUNNER_TEMP/benchmark-x86-stage-admission.json" -- python3 scripts/seed/stage-native-benchmark-corpus.py --complete "$RUNNER_TEMP/native-proof/complete" --out "$RUNNER_TEMP/benchmark-x86/corpus"
      - name: Native x86 factory and exact equality to the executed ARM host/payloads
        run: python3 scripts/seed/native_build_queue.py --jobs 1 --output "$RUNNER_TEMP/benchmark-x86-factory-admission.json" -- python3 scripts/seed/check-native-benchmark-host.py --complete "$RUNNER_TEMP/native-proof/complete" --arm-controls "$RUNNER_TEMP/arm-host-reference/observations.json" --corpus "$RUNNER_TEMP/benchmark-x86/corpus" --output "$RUNNER_TEMP/benchmark-x86/factory" --full-counts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-benchmark-x86-factory-evidence
          path: |
            ${{ runner.temp }}/benchmark-x86/**/observations.json
            ${{ runner.temp }}/benchmark-x86/**/*.stdout
            ${{ runner.temp }}/benchmark-x86/**/*.stderr
            ${{ runner.temp }}/benchmark-x86/**/*.kotoba
            ${{ runner.temp }}/benchmark-x86/**/*.ksl
            ${{ runner.temp }}/benchmark-x86/*/observer.py
            ${{ runner.temp }}/benchmark-x86-*-admission.json
          if-no-files-found: error
  shared-browser-components:
    name: Shared text / DOM / text-edit (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: arm64
          - runner: ubuntu-latest
            target: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/browser
          ref: 6e3ca4e768d886060abe7bff70da07cf36f5dabc
          path: _shared/browser
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/dom-gpu
          ref: c0be10ca6b0089e5fbe061eb76a6c23e61f61b22
          path: _shared/dom
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/kotoba
          ref: b7719f723fbf94f11e19dcda12641f682e324e62
          path: _shared/text
          persist-credentials: false
      - name: Verify source owner pins and native compiler bytes
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          pins = json.loads(Path('seed/shared-browser-components.json').read_text())
          for name, owner in pins['repositories'].items():
              root = Path('_shared') / name
              assert subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip() == owner['revision']
              for path, digest in owner['files'].items():
                  assert hashlib.sha256((root / path).read_bytes()).hexdigest() == digest, (name, path)
          arm = os.environ['TARGET'] == 'arm64'
          image = Path('seed/bootstrap/aarch64-linux-static-root.elf' if arm else 'bin/amu')
          meta = json.loads(Path('seed/bootstrap/aarch64-linux-static-root.json' if arm else 'native-product.json').read_text())
          assert hashlib.sha256(image.read_bytes()).hexdigest() == meta['image']['sha256']
          PY
      - name: Locked typed x86 project and refusal controls
        if: matrix.target == 'x86_64'
        run: python3 scripts/seed/check-x86-project-native.py --compiler "$PWD/bin/amu" --output "$RUNNER_TEMP/x86-project"
      - name: Execute actual shared modules (ARM)
        if: matrix.target == 'arm64'
        run: |
          python3 _shared/browser/scripts/check-shared-native.py --compiler "$PWD/seed/bootstrap/aarch64-linux-static-root.elf" --target arm64 --runner-source "$PWD/seed/x86_64-kx64-runner.kotoba" --browser "$PWD/_shared/browser" --dom "$PWD/_shared/dom" --text "$PWD/_shared/text/lib/kotoba.text" --output "$RUNNER_TEMP/shared-components"
      - name: Execute actual shared modules (x86)
        if: matrix.target == 'x86_64'
        run: |
          python3 _shared/browser/scripts/check-shared-native.py --compiler "$PWD/bin/amu" --target x86_64 --runner "$RUNNER_TEMP/x86-project/runner.elf" --browser "$PWD/_shared/browser" --dom "$PWD/_shared/dom" --text "$PWD/_shared/text/lib/kotoba.text" --output "$RUNNER_TEMP/shared-components"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: shared-components-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/shared-components/*.json
            ${{ runner.temp }}/shared-components/*.stdout
            ${{ runner.temp }}/shared-components/*.stderr
            ${{ runner.temp }}/shared-components/*.ksl
            ${{ runner.temp }}/x86-project/*.json
            ${{ runner.temp }}/x86-project/*.stdout
            ${{ runner.temp }}/x86-project/*.stderr
          if-no-files-found: warn

name: selfhost-native
# Loaderless Amu selfhost on native kernels (no C compiler or loader, no
# emulation): the pinned Amu-produced root bootstraps on arm64 Linux, and the
# x86_64 compiler and KX64V1 runner it builds are qualified on x86_64 Linux.
# Python only orchestrates processes and hashes.
#
# Tiers (scripts/seed/selfhost-bootstrap.py --tier; every check runs in one):
#   pull_request -> pr:   the root F rebuilds itself, F's targets, F's core route
#                         (the adoption image), boundary corpus, cases,
#                         hardening, capabilities, the cases as wasm32-browser
#                         modules; x86_64: X2, cases, hardening, and the
#                         wasm32-browser modules in headless Chrome (JUN-353:
#                         the arm64 image has no Chrome or Chromium).
#                         On both kernels in every tier: the static runtimes'
#                         stdin (wire 41), durable files and sleep (35, 7) and
#                         spawn (20) checks, with their refusal and seccomp
#                         controls (JUN-354, JUN-357, JUN-359, JUN-360).
#   push to main -> main: + G2/G3 through the runner, the packed core P, the
#                         Linux selfhost closure fixed point; x86_64: X3, the
#                         KX64V1 runner, the scalar and aiueos suites.
#   schedule, workflow_dispatch -> full: + the deep provenance from source
#                         (C0 -> the adoption image; C0 -> Kw -> Pw -> F).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "bin/amu"
      - "bin/kotoba"
      - "bin/kotoba-compiler"
      - "native-product.json"
      - "seed/**"
      - "scripts/seed/**"
      - "bench/embench/proof-v1/**"
      - "tools/gpu_*.kotoba"
      - "tools/spirv_*.kotoba"
      - "tools/static_launcher*.kotoba"
      - "tools/b2/**"
      - "runtime/wasm32-browser-static-*"
      - ".github/workflows/selfhost-native.yml"
  pull_request:
    branches: [main]
    paths:
      - "bin/amu"
      - "bin/kotoba"
      - "bin/kotoba-compiler"
      - "native-product.json"
      - "seed/**"
      - "scripts/seed/**"
      - "bench/embench/proof-v1/**"
      - "tools/gpu_*.kotoba"
      - "tools/spirv_*.kotoba"
      - "tools/static_launcher*.kotoba"
      - "tools/b2/**"
      - "runtime/wasm32-browser-static-*"
      - ".github/workflows/selfhost-native.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer PR push supersedes the old run; full runs on main queue instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  native-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Observer and admission negative controls
        run: |
          python3 scripts/seed/test_native_iteration.py -v
          python3 scripts/seed/test_native_preflight_projects.py -v
          python3 scripts/seed/test_native_gate_shard.py -v
      - name: QMP observer pipe framing and deadline controls
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/seed/test_aiueos_qmp_stdio.py -v
      - name: Benchmark staging observer format controls (not timing qualification)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/seed/test_embench_candidate.py -v
      - name: Closed benchmark factory and immutable oracle source controls
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/seed/test_native_benchmark_host.py -v
      - name: Proof record audits (not native verdict or performance qualification)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 bench/embench/proof-v1/validate.py
          python3 -m unittest discover -s bench/embench/proof-v1 -p 'test_*.py' -v
      - name: Source and image identity preflight
        run: python3 scripts/seed/check-native-identities.py
      - name: Independent native preflight controls through the shared two-slot plan
        run: >-
          python3 scripts/seed/native_build_queue.py
          --manifest seed/native-preflight-plan.json --phase preflight --jobs 2
          --slot-dir "$RUNNER_TEMP/native-build-slots"
          --output "$RUNNER_TEMP/preflight-schedule"
      - name: Retain the actual B2 preflight admission
        if: always()
        run: |
          python3 - <<'PY_GATE'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          path = root / "preflight-schedule/schedule.json"
          if path.exists():
              report = json.loads(path.read_text())
              assert report["jobs"] == report["capacity"] == 2
              for row in report["gates"]:
                  if row["name"] == "b2-preflight":
                      (root / "b2-libc-preflight-admission.json").write_text(json.dumps(
                          dict(schema="amu.native-build-admission.v1", **row)) + "\n")
              if report["status"] == "COMPLETED":
                  assert {row["name"] for row in report["gates"]} == {
                      "local-project-fs", "early-kotoba", "b2-preflight"}
          PY_GATE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: b2-loader-native-preflight
          path: |
            ${{ runner.temp }}/b2-libc-preflight
            ${{ runner.temp }}/b2-libc-preflight-admission.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: early-native-kotoba24
          path: |
            ${{ runner.temp }}/early-kotoba/*.json
            ${{ runner.temp }}/early-kotoba/*.stdout
            ${{ runner.temp }}/early-kotoba/*.stderr
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: local-native-preflight
          path: |
            ${{ runner.temp }}/local-native-project/*.json
            ${{ runner.temp }}/project-fs-candidate/*.json
            ${{ runner.temp }}/project-fs-candidate/*.ksl
            ${{ runner.temp }}/project-fs-candidate/*.stdout
            ${{ runner.temp }}/project-fs-candidate/*.stderr
            ${{ runner.temp }}/preflight-schedule
          if-no-files-found: warn
  bootstrap-arm64:
    needs: native-preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Loaderless bootstrap from the pinned root (arm64, native)
        env:
          TIER: ${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'push' && 'main' || 'full' }}
        run: python3 scripts/seed/selfhost-bootstrap.py --output "$RUNNER_TEMP/boot" --tier "$TIER"
      - name: Fresh one-compiler derivation before independent ISA qualification
        run: python3 scripts/seed/native_build_queue.py --manifest seed/native-gate-plan.json --phase derive-arm64 --jobs 2 --output "$RUNNER_TEMP/pg-derive-arm64"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: one-compiler-receipt
          path: |
            ${{ runner.temp }}/one/one-compiler.json
            ${{ runner.temp }}/one/calls.json
            ${{ runner.temp }}/one/F2.elf
            ${{ runner.temp }}/one/F1.elf
            ${{ runner.temp }}/one/F1.kseed
            ${{ runner.temp }}/one/F2.kseed
            ${{ runner.temp }}/one/F3.kseed
            ${{ runner.temp }}/one/full.kotoba
            ${{ runner.temp }}/one/runner.kotoba
            ${{ runner.temp }}/one/F-x86_64.elf
          if-no-files-found: warn
      # Keep the transported compiler files at the artifact root. Adding the
      # sibling AOT directory above changes upload-artifact's common ancestor.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-arm64
          path: |
            ${{ runner.temp }}/boot/selfhost-bootstrap.json
            ${{ runner.temp }}/boot/root.elf
            ${{ runner.temp }}/boot/F*.elf
            ${{ runner.temp }}/boot/runtime-boundary/runtime-boundary.json
            ${{ runner.temp }}/boot/runtime-boundary/calls.json
            ${{ runner.temp }}/boot/calls.json
            ${{ runner.temp }}/boot/S-x86_64.elf
            ${{ runner.temp }}/boot/R-x86_64.elf
            ${{ runner.temp }}/boot/selfhost-unity.kotoba
            ${{ runner.temp }}/boot/wasm32/*.wasm
          if-no-files-found: error
      # a separate artifact: another path in the one above would move its root
      # (the qualify job expects boot/ at the top)
  qualify-arm64:
    needs: bootstrap-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: bootstrap-arm64
          path: ${{ runner.temp }}/boot
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: one-compiler-receipt
          path: ${{ runner.temp }}/one
      - name: Verify current source/image/receipt bindings before transported native execution
        run: |
          python3 scripts/seed/check-native-identities.py
          python3 scripts/seed/check-native-arm-transport.py --bootstrap "$RUNNER_TEMP/boot" --one "$RUNNER_TEMP/one" --output "$RUNNER_TEMP/arm-transport.json"
      - name: Capability-free AIUEOS user ELF ABI and refusals (arm64, native)
        run: python3 scripts/seed/check-aiueos-user-elf-native.py --compiler "$RUNNER_TEMP/boot/F1.elf" --output "$RUNNER_TEMP/aiueos-user-elf-arm"
      - name: Static runtime stdin, wire 41 (arm64, native)
        run: python3 scripts/seed/check-io-read.py --compiler "$RUNNER_TEMP/boot/F1.elf" --output "$RUNNER_TEMP/runtime/io-read"
      - name: Static runtime durable files and sleep, wires 35 and 7 (arm64, native)
        run: python3 scripts/seed/check-durable-sleep.py --compiler "$RUNNER_TEMP/boot/F1.elf" --output "$RUNNER_TEMP/runtime/durable-sleep"
      - name: Native private store and STOP/CONT sleep resume (arm64)
        run: |
          python3 scripts/seed/check-private-store.py --compiler "$RUNNER_TEMP/boot/F1.elf" --output "$RUNNER_TEMP/runtime/private-store"
          python3 scripts/seed/check-sleep-resume.py --compiler "$RUNNER_TEMP/boot/F1.elf" --output "$RUNNER_TEMP/runtime/sleep-resume/receipt.json"
      - name: Static runtime spawn, wire 20 (arm64, native)
        run: python3 scripts/seed/check-spawn-runtime.py --compiler "$RUNNER_TEMP/boot/F1.elf" --output "$RUNNER_TEMP/runtime/spawn"
      - name: Independent arm64 gates (bounded native build queue)
        run: python3 scripts/seed/native_build_queue.py --manifest seed/native-gate-plan.json --phase arm64 --jobs 2 --output "$RUNNER_TEMP/pg-arm64"
      - name: Native FS2 forms, kernel errors and journal cleanup (arm64)
        run: python3 scripts/seed/check-native-fs2.py --compiler "$RUNNER_TEMP/one/F2.elf" --output "$RUNNER_TEMP/fs2-arm"
      - name: Native typed live ABI and user-context admission (arm64)
        run: |
          python3 scripts/seed/check-static-profile-native.py --build "$RUNNER_TEMP/boot" --output "$RUNNER_TEMP/static-profile-arm"
          python3 scripts/seed/check-aiueos-value-call-native.py --build "$RUNNER_TEMP/boot" --output "$RUNNER_TEMP/live-call-arm"
          python3 scripts/seed/check-aiueos-user-native.py --build "$RUNNER_TEMP/boot" --output "$RUNNER_TEMP/user-context-arm"
          python3 scripts/seed/check-aiueos-desktop-regions-native.py --build "$RUNNER_TEMP/boot" --output "$RUNNER_TEMP/desktop-regions-arm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-abi-arm-evidence
          path: |
            ${{ runner.temp }}/static-profile-arm/native-static-profile.json
            ${{ runner.temp }}/static-profile-arm/*/calls.json
            ${{ runner.temp }}/live-call-arm/native-value-call.json
            ${{ runner.temp }}/live-call-arm/*/calls.json
            ${{ runner.temp }}/user-context-arm/native-user-context.json
            ${{ runner.temp }}/user-context-arm/*/calls.json
            ${{ runner.temp }}/desktop-regions-arm/native-desktop-regions.json
            ${{ runner.temp }}/desktop-regions-arm/*/calls.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-fs2-arm-evidence
          path: ${{ runner.temp }}/fs2-arm
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: label-index-arm64-evidence
          path: |
            ${{ runner.temp }}/ccf-filter-arm64/*.json
            ${{ runner.temp }}/ccf-filter-arm64/*.stdout
            ${{ runner.temp }}/ccf-filter-arm64/*.stderr
            ${{ runner.temp }}/flock-vector-arm64/*.json
            ${{ runner.temp }}/flock-vector-arm64/*.stdout
            ${{ runner.temp }}/flock-vector-arm64/*.stderr
            ${{ runner.temp }}/runtime-profile-arm64/*.json
            ${{ runner.temp }}/runtime-profile-arm64/*.stdout
            ${{ runner.temp }}/runtime-profile-arm64/*.stderr
            ${{ runner.temp }}/zero-watermark-arm64/*.json
            ${{ runner.temp }}/zero-watermark-arm64/*.stdout
            ${{ runner.temp }}/zero-watermark-arm64/*.stderr
            ${{ runner.temp }}/label-index-arm64/*.json
            ${{ runner.temp }}/label-index-arm64/*.stdout
            ${{ runner.temp }}/label-index-arm64/*.stderr
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kototama-i64-arm64
          path: |
            ${{ runner.temp }}/kototama-i64-arm64/report.json
            ${{ runner.temp }}/kototama-i64-arm64/gate.stdout
            ${{ runner.temp }}/kototama-i64-arm64/gate.stderr
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kototama-receipt-arm64
          path: ${{ runner.temp }}/kototama-receipt-arm64
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-launcher-arm64
          path: ${{ runner.temp }}/launcher/static-launcher.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-checks-arm64
          path: |
            ${{ runner.temp }}/runtime/io-read/io-read.json
            ${{ runner.temp }}/runtime/durable-sleep/durable-sleep.json
            ${{ runner.temp }}/runtime/spawn/spawn-runtime.json
            ${{ runner.temp }}/runtime/private-store/receipt.json
            ${{ runner.temp }}/runtime/sleep-resume/receipt.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-scheduling-arm64
          path: ${{ runner.temp }}/pg-arm64
          if-no-files-found: warn
  qualify-benchmark-arm:
    needs: bootstrap-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: bootstrap-arm64
          path: ${{ runner.temp }}/boot
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: one-compiler-receipt
          path: ${{ runner.temp }}/one
      - name: Verify current source/image/receipt bindings before transported native execution
        run: |
          python3 scripts/seed/check-native-identities.py
          python3 scripts/seed/check-native-arm-transport.py --bootstrap "$RUNNER_TEMP/boot" --one "$RUNNER_TEMP/one" --output "$RUNNER_TEMP/arm-transport.json"
      - name: Unchanged original19 library/export provenance (ARM native producer)
        run: python3 scripts/seed/native_build_queue.py --jobs 1 --output "$RUNNER_TEMP/benchmark-arm-stage-admission.json" -- python3 scripts/seed/stage-native-benchmark-corpus.py --one "$RUNNER_TEMP/one" --out "$RUNNER_TEMP/benchmark-arm/corpus"
      - name: Closed measurement host, original full counts and native accounting oracle
        run: python3 scripts/seed/native_build_queue.py --jobs 1 --output "$RUNNER_TEMP/benchmark-arm-host-admission.json" -- python3 scripts/seed/check-native-benchmark-host.py --one "$RUNNER_TEMP/one" --corpus "$RUNNER_TEMP/benchmark-arm/corpus" --output "$RUNNER_TEMP/benchmark-arm/host" --full-counts
      - name: Actually built and executed timing/accounting/reset/highwater mutants
        run: python3 scripts/seed/native_build_queue.py --jobs 1 --output "$RUNNER_TEMP/benchmark-arm-mutants-admission.json" -- python3 scripts/seed/check-native-benchmark-mutations.py --one "$RUNNER_TEMP/one" --controls "$RUNNER_TEMP/benchmark-arm/host" --output "$RUNNER_TEMP/benchmark-arm/mutations"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-benchmark-arm-evidence
          path: |
            ${{ runner.temp }}/benchmark-arm/**/observations.json
            ${{ runner.temp }}/benchmark-arm/**/*.stdout
            ${{ runner.temp }}/benchmark-arm/**/*.stderr
            ${{ runner.temp }}/benchmark-arm/**/*.kotoba
            ${{ runner.temp }}/benchmark-arm/**/*.ksl
            ${{ runner.temp }}/benchmark-arm/*/observer.py
            ${{ runner.temp }}/benchmark-arm-*-admission.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-benchmark-arm-host-reference
          path: ${{ runner.temp }}/benchmark-arm/host/observations.json
          if-no-files-found: error

  derive-x86_64:
    needs: bootstrap-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootstrap-arm64
          path: ${{ runner.temp }}/boot
      - name: Capability-free AIUEOS user ELF ABI and refusals (x86_64, native)
        run: python3 scripts/seed/check-aiueos-user-elf-native.py --compiler "$PWD/bin/amu" --output "$RUNNER_TEMP/aiueos-user-elf-x86"
      - name: Native x86_64 qualification (no loader, no emulation)
        env:
          TIER: ${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'push' && 'main' || 'full' }}
        run: python3 scripts/seed/check-x86_64-native.py --bootstrap "$RUNNER_TEMP/boot" --output "$RUNNER_TEMP/x86" --tier "$TIER"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: one-compiler-receipt
          path: ${{ runner.temp }}/one
      - name: Complete native x86 compiler fixed point and CDCI images
        run: python3 scripts/seed/check-complete-x86.py --compiler "$RUNNER_TEMP/one/F-x86_64.elf" --arm-proof "$RUNNER_TEMP/one/one-compiler.json" --output "$RUNNER_TEMP/complete"
      - name: Public native product and aliases
        run: python3 scripts/seed/check-public-native-product.py --product "$GITHUB_WORKSPACE" --complete "$RUNNER_TEMP/complete" --output "$RUNNER_TEMP/public-product"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-x86-derivation
          path: |
            ${{ runner.temp }}/complete
            ${{ runner.temp }}/x86
            ${{ runner.temp }}/public-product
            ${{ runner.temp }}/aiueos-user-elf-x86
          if-no-files-found: error

  qualify-x86-shards:
    needs: derive-x86_64
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            receipt: x86_64-native-receipt
            schedule: native-scheduling-x86
          - shard: extensions
            receipt: x86_64-native-extension-receipt
            schedule: native-scheduling-x86-extensions
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: bootstrap-arm64
          path: ${{ runner.temp }}/boot
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-x86-derivation
          path: ${{ runner.temp }}
      - name: Verify current source and public image before transported native gates
        run: |
          python3 scripts/seed/check-native-identities.py
          python3 scripts/seed/check-public-native-product.py --product "$GITHUB_WORKSPACE" --complete "$RUNNER_TEMP/complete" --output "$RUNNER_TEMP/transported-public-product"
          chmod 700 "$RUNNER_TEMP/complete/F1.elf" "$RUNNER_TEMP/complete/F2.elf" "$RUNNER_TEMP/complete/F3.elf"
      - name: Static runtime stdin, wire 41 (x86_64, native)
        run: python3 scripts/seed/check-io-read.py --compiler "$RUNNER_TEMP/complete/F2.elf" --target x86_64-linux --output "$RUNNER_TEMP/runtime/io-read"
      - name: Static runtime durable files and sleep, wires 35 and 7 (x86_64, native)
        run: python3 scripts/seed/check-durable-sleep.py --compiler "$RUNNER_TEMP/complete/F2.elf" --target x86_64-linux --output "$RUNNER_TEMP/runtime/durable-sleep"
      - name: Native private store and STOP/CONT sleep resume (x86_64)
        run: |
          python3 scripts/seed/check-private-store.py --compiler "$RUNNER_TEMP/complete/F2.elf" --output "$RUNNER_TEMP/runtime/private-store"
          python3 scripts/seed/check-sleep-resume.py --compiler "$RUNNER_TEMP/complete/F2.elf" --output "$RUNNER_TEMP/runtime/sleep-resume/receipt.json"
      - name: Static runtime spawn, wire 20 (x86_64, native)
        run: python3 scripts/seed/check-spawn-runtime.py --compiler "$RUNNER_TEMP/complete/F2.elf" --target x86_64-linux --output "$RUNNER_TEMP/runtime/spawn"
      - name: Independent x86 gates (bounded native build queue)
        run: |
          python3 scripts/seed/native_gate_shard.py --manifest seed/native-gate-plan.json --shard "${{ matrix.shard }}" --output "$RUNNER_TEMP/x86-shard-plan.json"
          python3 scripts/seed/native_build_queue.py --manifest "$RUNNER_TEMP/x86-shard-plan.json" --phase x86 --jobs 2 --output "$RUNNER_TEMP/pg-x86"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.shard == 'core'
        with:
          name: live-abi-x86-evidence
          path: |
            ${{ runner.temp }}/static-profile-x86/native-static-profile.json

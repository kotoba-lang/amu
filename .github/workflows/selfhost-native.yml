name: selfhost-native
# Loaderless Amu selfhost on native kernels (no C compiler or loader, no
# emulation): the pinned Amu-produced root bootstraps on arm64 Linux, and the
# x86_64 compiler and KX64V1 runner it builds are qualified on x86_64 Linux.
# The runtime's native TCP wires 43..47 run on loopback on both, and wire 20
# spawns programs through the helper on both.
# Python only orchestrates processes and hashes.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "seed/**"
      - "scripts/seed/**"
      - ".github/workflows/selfhost-native.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  bootstrap-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Loaderless bootstrap from the pinned root (arm64, native)
        run: python3 scripts/seed/selfhost-bootstrap.py --output "$RUNNER_TEMP/boot"
      - name: Native TCP wires 43..47 on loopback (arm64, native, seccomp enforced)
        run: python3 scripts/seed/check-net-runtime.py --compiler "$RUNNER_TEMP/boot/S3.elf" --output "$RUNNER_TEMP/net"
      - name: Process spawn wire 20 through the helper (arm64, native, seccomp enforced)
        run: python3 scripts/seed/check-spawn-runtime.py --compiler "$RUNNER_TEMP/boot/S3.elf" --output "$RUNNER_TEMP/spawn"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-arm64
          path: |
            ${{ runner.temp }}/boot/selfhost-bootstrap.json
            ${{ runner.temp }}/boot/S-x86_64.elf
            ${{ runner.temp }}/boot/R-x86_64.elf
            ${{ runner.temp }}/boot/selfhost-unity.kotoba
          if-no-files-found: error
      # its own artifact: a second directory in the one above would move its
      # root to runner.temp, and qualify-x86_64 reads boot/ at the top
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: net-runtime-arm64
          path: ${{ runner.temp }}/net/net-runtime.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spawn-runtime-arm64
          path: ${{ runner.temp }}/spawn/spawn-runtime.json
          if-no-files-found: error
  qualify-x86_64:
    needs: bootstrap-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootstrap-arm64
          path: ${{ runner.temp }}/boot
      - name: Native x86_64 qualification (no loader, no emulation)
        run: python3 scripts/seed/check-x86_64-native.py --bootstrap "$RUNNER_TEMP/boot" --output "$RUNNER_TEMP/x86"
      - name: Native TCP wires 43..47 on loopback (x86_64, native, seccomp enforced)
        run: python3 scripts/seed/check-net-runtime.py --compiler "$RUNNER_TEMP/boot/S-x86_64.elf" --target x86_64-linux --output "$RUNNER_TEMP/net-x86"
      - name: Process spawn wire 20 through the helper (x86_64, native, seccomp enforced)
        run: python3 scripts/seed/check-spawn-runtime.py --compiler "$RUNNER_TEMP/boot/S-x86_64.elf" --target x86_64-linux --output "$RUNNER_TEMP/spawn-x86"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: x86_64-native-receipt
          path: |
            ${{ runner.temp }}/x86/x86_64-native.json
            ${{ runner.temp }}/x86/raw
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: net-runtime-x86_64
          path: ${{ runner.temp }}/net-x86/net-runtime.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spawn-runtime-x86_64
          path: ${{ runner.temp }}/spawn-x86/spawn-runtime.json
          if-no-files-found: warn

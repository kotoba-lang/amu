name: mac-selfhost-aiueos

on:
  pull_request:
    paths:
      - '.github/workflows/mac-selfhost-aiueos.yml'
      - '.github/workflows/selfhost-native.yml'
      - 'scripts/seed/check-aiueos-user-elf-native.py'
      - 'scripts/seed/check-aiueos-user-macos-native.py'
      - 'scripts/seed/check-aiueos-user-v3-macos-native.py'
      - 'scripts/seed/check-aiueos-user-v5-layout-macos-native.py'
      - 'scripts/seed/check-aiueos-kernel-v3-layout-macos-native.py'
      - 'scripts/seed/check-macos-exec-smoke*.py'
      - 'scripts/seed/check-aiueos-object-exports.py'
      - 'scripts/seed/check-aiueos-object-windows.py'
      - 'scripts/seed/check-macos-arena-scope-refusal.py'
      - 'scripts/seed/check-macos-cross-linux-candidates.py'
      - 'scripts/seed/check-macos-cross-linux-native.py'
      - 'scripts/seed/write-bootstrap-descriptors.py'
      - 'scripts/seed/test-write-bootstrap-descriptors.py'
      - 'scripts/seed/check-descriptor-writer-ci.py'
      - 'scripts/seed/check-macos-core-adoption.py'
      - 'scripts/seed/collect-macos-crash-summary.py'
      - 'scripts/seed/native_build_queue.py'
      - 'seed/FULL-MANIFEST'
      - 'seed/X86_64-LINUX-SELFHOST-MANIFEST'
      - 'seed/*.kotoba'
      - 'seed/**/*.kotoba'
      - 'seed/bootstrap/aarch64-macos/**'
      - 'seed/compiler-core.json'
      - 'seed/adoption-aiueos-llm-v1-20261026.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-root:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify Apple Silicon host
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Rebuild Amu root and AIUEOS user target
        run: |
          python3 scripts/seed/native_build_queue.py \
            --phase mac-aiueos-user-root \
            --slot-dir "$RUNNER_TEMP/native-build-slots" \
            --output "$RUNNER_TEMP/mac-root-admission.json" -- \
            python3 scripts/seed/check-aiueos-user-macos-native.py \
              --output "$RUNNER_TEMP/mac-root"
      - name: Check bounded user-v3 local-model target
        run: |
          python3 scripts/seed/check-aiueos-user-v3-macos-native.py \
            --mac-build "$RUNNER_TEMP/mac-root" \
            --output "$RUNNER_TEMP/mac-user-v3"
      - name: Check candidate user-v5 ELF and slot-v4 boundaries
        run: |
          python3 scripts/seed/check-aiueos-user-v5-layout-macos-native.py \
            --mac-build "$RUNNER_TEMP/mac-root" \
            --output "$RUNNER_TEMP/mac-user-v5"
      - name: Check kernel-v3 guest artifact and slot-v4 admission
        run: |
          python3 scripts/seed/check-aiueos-kernel-v3-layout-macos-native.py \
            --mac-build "$RUNNER_TEMP/mac-root" \
            --user-v5-slot "$RUNNER_TEMP/mac-user-v5/user-v5-call.slot" \
            --output "$RUNNER_TEMP/mac-kernel-v3"
      - name: Verify the selected 18-module core adoption on Mac
        run: |
          python3 scripts/seed/check-macos-core-adoption.py \
            --mac-build "$RUNNER_TEMP/mac-root" \
            --output "$RUNNER_TEMP/mac-core"
      - name: Native Darwin bounded I/O and error refusal probe
        run: |
          python3 scripts/seed/native_build_queue.py \
            --phase mac-exec-smoke \
            --slot-dir "$RUNNER_TEMP/native-build-slots" -- \
            python3 scripts/seed/check-macos-exec-smoke-native.py \
              --mac-build "$RUNNER_TEMP/mac-root" \
              --output "$RUNNER_TEMP/mac-smoke"
      - name: Mac runtime refuses arena-scope with exit 70 (JUN-546)
        run: |
          python3 scripts/seed/check-macos-arena-scope-refusal.py \
            --output "$RUNNER_TEMP/mac-scope-refusal"
      - name: AIUEOS kernel object route emits one or several exports (JUN-556)
        run: |
          python3 scripts/seed/check-aiueos-object-exports.py \
            --compiler "$RUNNER_TEMP/mac-root/F2-signed.macho" \
            --output "$RUNNER_TEMP/mac-object-exports"
      - name: AIUEOS kernel object route u8 / u16 / u64 window accesses (JUN-556 B)
        run: |
          python3 scripts/seed/check-aiueos-object-windows.py \
            --compiler "$RUNNER_TEMP/mac-root/F2-signed.macho" \
            --output "$RUNNER_TEMP/mac-object-windows"
      - name: Cross-build Linux compiler candidates from Mac fixed point
        run: |
          python3 scripts/seed/check-macos-cross-linux-candidates.py \
            --mac-build "$RUNNER_TEMP/mac-root" \
            --output "$RUNNER_TEMP/mac-cross"
      - name: Descriptor writer controls on disposable receipt-derived fixture
        run: |
          python3 scripts/seed/check-descriptor-writer-ci.py \
            --mac-build "$RUNNER_TEMP/mac-root" \
            --cross-build "$RUNNER_TEMP/mac-cross"
      - name: Summarize native crash if the root gate failed
        if: failure()
        run: |
          python3 scripts/seed/collect-macos-crash-summary.py \
            --process amu-full-root \
            --output "$RUNNER_TEMP/mac-root-crash-summary.json"
      - name: Upload source-bound Mac receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac-aiueos-user-root
          path: |
            ${{ runner.temp }}/mac-root-admission.json
            ${{ runner.temp }}/mac-root/mac-aiueos-user-target.json
            ${{ runner.temp }}/mac-smoke/native-smoke.json
            ${{ runner.temp }}/mac-smoke/execution/receipt.json
            ${{ runner.temp }}/mac-root-crash-summary.json
          if-no-files-found: warn
      - name: Upload user-v3 Mac receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac-aiueos-user-v3
          path: ${{ runner.temp }}/mac-user-v3/mac-aiueos-user-v3-local-call.json
          if-no-files-found: warn
      - name: Upload user-v5 layout receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac-aiueos-user-v5-layout
          path: ${{ runner.temp }}/mac-user-v5/mac-aiueos-user-v5-layout.json
          if-no-files-found: warn
      - name: Upload kernel-v3 layout receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac-aiueos-kernel-v3-layout
          path: ${{ runner.temp }}/mac-kernel-v3/mac-aiueos-kernel-v3-layout.json
          if-no-files-found: warn
      - name: Upload selected core adoption receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac-aiueos-core-adoption
          path: ${{ runner.temp }}/mac-core/mac-core-adoption.json
          if-no-files-found: warn
      - name: Upload Mac-produced Linux candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac-cross-linux-candidates
          path: ${{ runner.temp }}/mac-cross/
          if-no-files-found: error
  native-cross-arm64:
    needs: mac-root
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mac-cross-linux-candidates
          path: ${{ runner.temp }}/mac-cross
      - name: Execute Mac-produced ARM root and verify native fixed point
        run: >-
          python3 scripts/seed/check-macos-cross-linux-native.py
          --candidate "$RUNNER_TEMP/mac-cross"
          --output "$RUNNER_TEMP/cross-arm"
          --isa aarch64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mac-cross-native-arm64
          path: ${{ runner.temp }}/cross-arm/native-fixed-point.json
          if-no-files-found: warn
  native-cross-x86_64:
    needs: mac-root
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mac-cross-linux-candidates
          path: ${{ runner.temp }}/mac-cross
      - name: Execute Mac-produced x86 compiler and verify native fixed point
        run: >-
          python3 scripts/seed/check-macos-cross-linux-native.py
          --candidate "$RUNNER_TEMP/mac-cross"
          --output "$RUNNER_TEMP/cross-x86"
          --isa x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mac-cross-native-x86_64
          path: ${{ runner.temp }}/cross-x86/native-fixed-point.json
          if-no-files-found: warn

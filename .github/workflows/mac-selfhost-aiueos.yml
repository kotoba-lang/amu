  native-cross-arm64:
    needs: mac-root
    runs-on: ${{ contains(fromJSON('["selfhosted","selfhosted-arm"]'), vars.AMU_RUNNER_PROFILE) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'amu-linux-arm64' || 'ubuntu-24.04-arm' }}  # amu-runner: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: gate
        uses: ./.github/actions/ci-gate
        with:
          job: mac-selfhost-aiueos-native-cross-arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.gate.outputs.skip != 'true'
        with:
          name: mac-cross-linux-candidates
          path: ${{ runner.temp }}/mac-cross
      - name: Execute Mac-produced ARM root and verify native fixed point
        if: steps.gate.outputs.skip != 'true'
        run: >-
          python3 scripts/seed/check-macos-cross-linux-native.py
          --candidate "$RUNNER_TEMP/mac-cross"
          --output "$RUNNER_TEMP/cross-arm"
          --isa aarch64
      - name: The Linux ARM64 root refuses an omitted target with E2 (KOTOBA-174)
        if: steps.gate.outputs.skip != 'true'
        run: >-
          python3 scripts/seed/check-host-default-target.py --isa aarch64
          --output "$RUNNER_TEMP/host-default-arm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.gate.outputs.skip != 'true'
        with:
          name: mac-cross-native-arm64
          path: |
            ${{ runner.temp }}/cross-arm/native-fixed-point.json
            ${{ runner.temp }}/host-default-arm/host-default-target.json
          if-no-files-found: warn
      - if: success() && steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/ci-save
        with:
          key: ${{ steps.gate.outputs.key }}
  native-cross-x86_64:
    needs: mac-root
    runs-on: ${{ vars.AMU_RUNNER_PROFILE == 'selfhosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'amu-linux-x86_64' || 'ubuntu-latest' }}  # amu-runner: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: gate
        uses: ./.github/actions/ci-gate
        with:
          job: mac-selfhost-aiueos-native-cross-x86_64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.gate.outputs.skip != 'true'
        with:
          name: mac-cross-linux-candidates
          path: ${{ runner.temp }}/mac-cross
      - name: Execute Mac-produced x86 compiler and verify native fixed point
        if: steps.gate.outputs.skip != 'true'
        run: >-
          python3 scripts/seed/check-macos-cross-linux-native.py
          --candidate "$RUNNER_TEMP/mac-cross"
          --output "$RUNNER_TEMP/cross-x86"
          --isa x86_64
      - name: The Linux x86_64 host entry names x86_64-linux; the compiler refuses an omitted target (KOTOBA-174)
        if: steps.gate.outputs.skip != 'true'
        run: >-
          python3 scripts/seed/check-host-default-target.py --isa x86_64 --reproduce
          --output "$RUNNER_TEMP/host-default-x86"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.gate.outputs.skip != 'true'
        with:
          name: mac-cross-native-x86_64
          path: |
            ${{ runner.temp }}/cross-x86/native-fixed-point.json
            ${{ runner.temp }}/host-default-x86/host-default-target.json
          if-no-files-found: warn
      - if: success() && steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/ci-save
        with:
          key: ${{ steps.gate.outputs.key }}

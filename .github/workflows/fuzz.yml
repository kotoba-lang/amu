name: long-fuzz

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: "libFuzzer duration in seconds"
        required: false
        default: "300"

permissions:
  contents: read

jobs:
  native-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.12.0"
          cache: npm
      - run: npm ci
      - name: Run coverage-guided native parser fuzzing
        env:
          KOTOBA_NATIVE_FUZZ_SECONDS: ${{ inputs.seconds || '300' }}
          KOTOBA_FUZZ_ARTIFACT_DIR: fuzz-results
        run: npx nbb scripts/fuzz-native.cljk
      - name: Preserve evolved corpus and crash inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-parser-fuzz-${{ github.run_id }}
          path: fuzz-results
          if-no-files-found: error
          retention-days: 30

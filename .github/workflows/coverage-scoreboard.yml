name: coverage-scoreboard
on:
  pull_request:
    paths:
      - "docs/qualification/target-coverage/**"
      - "scripts/coverage/**"
      - ".github/workflows/coverage-scoreboard.yml"
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -I scripts/coverage/scoreboard.py verify
      - run: python3 -I scripts/coverage/test_scoreboard.py

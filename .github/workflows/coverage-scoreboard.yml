name: coverage-scoreboard
on:
  pull_request:
    paths:
      - "docs/qualification/target-coverage/**"
      - "scripts/coverage/**"
      - ".github/workflows/coverage-scoreboard.yml"
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          python3 -m venv "$RUNNER_TEMP/basilisp-venv"
          "$RUNNER_TEMP/basilisp-venv/bin/pip" install --quiet basilisp==0.5.1 pytest
          echo "$RUNNER_TEMP/basilisp-venv/bin" >> "$GITHUB_PATH"
      - run: basilisp run scripts/coverage/scoreboard.cljc -- verify
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts/coverage basilisp test -p no:cacheprovider --rootdir scripts/coverage scripts/coverage/test_scoreboard.cljc

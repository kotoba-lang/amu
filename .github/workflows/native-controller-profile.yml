name: Native controller diagnostic
# A measurement-only lane: immutable ARM derivation transport, fresh native
# x86 build, then the unchanged controller alone. Not full product acceptance.
# Controller diagnostics require an explicitly selected source-identical
# derivation; a PR cannot silently reuse an older compiler's receipt.
on:
  pull_request:
    paths:
      - "scripts/seed/native_process_profile.py"
      - "scripts/seed/check-native-cdci.py"
      - ".github/workflows/native-controller-profile.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Measurement only; never substitutes for native qualification
        required: true
        default: controller
        type: choice
        options: [controller, proof-scans, proof-comparison, pass-core, pass-label, proof-current, source-refinements, ccf-order, zero-watermark, zero-hoist, zero-core, compiler-kernels, ccf-filtered, locked-runtime]
      derivation-run:
        description: Public Amu run with a source-identical one-compiler-receipt artifact
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: native-controller-profile-${{ github.event.pull_request.number || github.ref }}-${{ inputs.mode || 'controller' }}
  cancel-in-progress: true
jobs:
  zero-hoist:
    if: inputs.mode == 'zero-hoist'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            isa: x86_64
          - runner: ubuntu-24.04-arm
            isa: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify source and native producer pins
        run: python3 scripts/seed/check-native-identities.py
      - name: Native zero oracle, last-word mutant and matched reused-range comparison
        run: python3 scripts/seed/native_build_queue.py -- python3 scripts/seed/compare-native-zero-hoist.py --output "$RUNNER_TEMP/zero-hoist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-zero-hoist-${{ matrix.isa }}
          path: |
            ${{ runner.temp }}/zero-hoist/observations.json
            ${{ runner.temp }}/zero-hoist/*.stdout
            ${{ runner.temp }}/zero-hoist/*.stderr
          if-no-files-found: error
  zero-core:
    if: inputs.mode == 'zero-core'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            isa: x86_64
          - runner: ubuntu-24.04-arm
            isa: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify source and native producer pins
        run: python3 scripts/seed/check-native-identities.py
      - name: Native scope mutants, fixed point and matched frozen core18 builds
        run: python3 scripts/seed/native_build_queue.py -- python3 scripts/seed/compare-native-zero-watermark.py --workload core18 --hoist --output "$RUNNER_TEMP/zero-core"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-zero-core-${{ matrix.isa }}
          path: |
            ${{ runner.temp }}/zero-core/observations.json
            ${{ runner.temp }}/zero-core/*.stdout
            ${{ runner.temp }}/zero-core/*.stderr
          if-no-files-found: error
  zero-watermark:
    if: inputs.mode == 'zero-watermark'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            isa: x86_64
          - runner: ubuntu-24.04-arm
            isa: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify source and native producer pins
        run: python3 scripts/seed/check-native-identities.py
      - name: Native reuse oracle, actual mutants, fixed point and matched process batches
        run: python3 scripts/seed/native_build_queue.py -- python3 scripts/seed/compare-native-zero-watermark.py --output "$RUNNER_TEMP/zero-watermark"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-zero-watermark-${{ matrix.isa }}
          path: |
            ${{ runner.temp }}/zero-watermark/observations.json
            ${{ runner.temp }}/zero-watermark/*.stdout
            ${{ runner.temp }}/zero-watermark/*.stderr
          if-no-files-found: error
  locked-runtime:
    if: inputs.mode == 'locked-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source and native producer pins
        run: python3 scripts/seed/check-native-identities.py
      - name: Stage the exact zero-runtime experimental producer
        run: |
          git show 3bb81695c15549b280b368cb95145bb0a5840c18:bin/amu > "$RUNNER_TEMP/current-amu.elf"
          python3 -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"current-amu.elf"; assert hashlib.sha256(p.read_bytes()).hexdigest()=="dd289a234cb781248b29924139d8903865dd6337cb82c2ee8dcba7f261e31d98"'
          chmod +x "$RUNNER_TEMP/current-amu.elf"
          git show 0ff0d4b23d26f482e045a3312a26a4cce6d1a6b7:bin/amu > "$RUNNER_TEMP/previous-amu.elf"
          python3 -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"previous-amu.elf"; assert hashlib.sha256(p.read_bytes()).hexdigest()=="8cd12aed5b663976b77abc06c85bedc558c02f323ea235e3e5c194d3e4795091"'
          chmod +x "$RUNNER_TEMP/previous-amu.elf"
      - name: Old and new runtime on exactly the same source-lock compile path
        run: python3 scripts/seed/native_build_queue.py -- python3 scripts/seed/compare-native-compiler-kernels.py --baseline "$RUNNER_TEMP/previous-amu.elf" --compiler "$RUNNER_TEMP/current-amu.elf" --output "$RUNNER_TEMP/locked-runtime"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-locked-runtime
          path: |
            ${{ runner.temp }}/locked-runtime/observations.json
            ${{ runner.temp }}/locked-runtime/*.stdout
            ${{ runner.temp }}/locked-runtime/*.stderr
          if-no-files-found: error
  compiler-kernels:
    if: inputs.mode == 'compiler-kernels'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source and native producer pins
        run: python3 scripts/seed/check-native-identities.py
      - name: Stage the exact zero-runtime experimental producer
        run: |
          git show 3bb81695c15549b280b368cb95145bb0a5840c18:bin/amu > "$RUNNER_TEMP/current-amu.elf"
          python3 -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"current-amu.elf"; assert hashlib.sha256(p.read_bytes()).hexdigest()=="dd289a234cb781248b29924139d8903865dd6337cb82c2ee8dcba7f261e31d98"'
          chmod +x "$RUNNER_TEMP/current-amu.elf"
      - name: Exact role/public kernels on the same frozen input and native CPU
        run: python3 scripts/seed/native_build_queue.py -- python3 scripts/seed/compare-native-compiler-kernels.py --compiler "$RUNNER_TEMP/current-amu.elf" --output "$RUNNER_TEMP/compiler-kernels"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-compiler-kernels
          path: |
            ${{ runner.temp }}/compiler-kernels/observations.json
            ${{ runner.temp }}/compiler-kernels/*.stdout
            ${{ runner.temp }}/compiler-kernels/*.stderr
          if-no-files-found: error
  ccf-filtered:
    if: inputs.mode == 'ccf-filtered'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source and native producer pins
        run: python3 scripts/seed/check-native-identities.py
      - name: Stage the exact zero-runtime experimental producer
        run: |
          git show 3bb81695c15549b280b368cb95145bb0a5840c18:bin/amu > "$RUNNER_TEMP/current-amu.elf"
          python3 -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"current-amu.elf"; assert hashlib.sha256(p.read_bytes()).hexdigest()=="dd289a234cb781248b29924139d8903865dd6337cb82c2ee8dcba7f261e31d98"'
          chmod +x "$RUNNER_TEMP/current-amu.elf"
      - name: Native differential grid, actual mutants and matched frozen-core builds
        run: python3 scripts/seed/native_build_queue.py -- python3 scripts/seed/compare-native-ccf-order.py --variant filtered --current-core --source-revision 6abd468dcfecfb93cb79e161b07404beea539fdc --compiler "$RUNNER_TEMP/current-amu.elf" --output "$RUNNER_TEMP/ccf-filtered"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-ccf-filtered
          path: |
            ${{ runner.temp }}/ccf-filtered/observations.json
            ${{ runner.temp }}/ccf-filtered/*.stdout
            ${{ runner.temp }}/ccf-filtered/*.stderr
          if-no-files-found: error
  ccf-order:
    if: inputs.mode == 'ccf-order'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source and native producer pins
        run: python3 scripts/seed/check-native-identities.py
      - name: Stage the exact zero-runtime experimental producer
        run: |
          git show 3bb81695c15549b280b368cb95145bb0a5840c18:bin/amu > "$RUNNER_TEMP/current-amu.elf"
          python3 -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"current-amu.elf"; assert hashlib.sha256(p.read_bytes()).hexdigest()=="dd289a234cb781248b29924139d8903865dd6337cb82c2ee8dcba7f261e31d98"'
          chmod +x "$RUNNER_TEMP/current-amu.elf"
      - name: Native differential grid, actual mutants and matched frozen-core builds
        run: python3 scripts/seed/native_build_queue.py -- python3 scripts/seed/compare-native-ccf-order.py --current-core --compiler "$RUNNER_TEMP/current-amu.elf" --output "$RUNNER_TEMP/ccf-order"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-ccf-order
          path: |
            ${{ runner.temp }}/ccf-order/observations.json
            ${{ runner.temp }}/ccf-order/*.stdout
            ${{ runner.temp }}/ccf-order/*.stderr
          if-no-files-found: error
  pass-localization:
    if: contains(fromJSON('["pass-core", "pass-label", "proof-current"]'), inputs.mode)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify current source and native image pins
        run: python3 scripts/seed/check-native-identities.py
      - name: Native localization only; preserve the frozen workload and output
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = pass-label ]; then
            python3 scripts/seed/native_build_queue.py -- python3 scripts/seed/profile-native-passes.py --closure full --workload label-x86 --detail passes --output "$RUNNER_TEMP/localization" --seconds 900
          elif [ "$MODE" = proof-current ]; then
            python3 scripts/seed/native_build_queue.py -- python3 scripts/seed/profile-native-passes.py --closure core --workload core --detail proofs --output "$RUNNER_TEMP/localization" --seconds 900
          else
            python3 scripts/seed/native_build_queue.py -- python3 scripts/seed/profile-native-passes.py --closure core --workload core --detail passes --output "$RUNNER_TEMP/localization" --seconds 900
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-localization-${{ inputs.mode }}
          path: |
            ${{ runner.temp }}/localization/observations.json
            ${{ runner.temp }}/localization/events.jsonl
            ${{ runner.temp }}/localization/*.stdout
            ${{ runner.temp }}/localization/*.stderr
          if-no-files-found: warn
  source-refinements:
    if: inputs.mode == 'source-refinements'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify current source and native image pins
        run: python3 scripts/seed/check-native-identities.py
      - name: Native isolated candidates then B C C B source comparison
        run: python3 scripts/seed/native_build_queue.py -- python3 scripts/seed/compare-source-refinements.py --output "$RUNNER_TEMP/refinements"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-source-refinements
          path: |
            ${{ runner.temp }}/refinements/observations.json
            ${{ runner.temp }}/refinements/*.stdout
            ${{ runner.temp }}/refinements/*.stderr
          if-no-files-found: error
  proof-comparison:
    if: inputs.mode == 'proof-comparison'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Native semantic and mutation controls first
        run: python3 scripts/seed/native_build_queue.py -- python3 scripts/seed/check-native-label-index.py --compiler "$GITHUB_WORKSPACE/bin/amu" --output "$RUNNER_TEMP/label-index" --controls-only
      - name: Same-host native baseline candidate candidate baseline
        run: python3 scripts/seed/native_build_queue.py --output "$RUNNER_TEMP/admission.json" -- python3 scripts/seed/compare-proof-scans.py --baseline-revision db6b2f085f627b413a9bc6f80f90ab942481e6b2 --output "$RUNNER_TEMP/comparison"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-proof-comparison
          path: |
            ${{ runner.temp }}/admission.json
            ${{ runner.temp }}/label-index/observations.json
            ${{ runner.temp }}/label-index/*.stderr
            ${{ runner.temp }}/comparison/observations.json
            ${{ runner.temp }}/comparison/*.stderr
            ${{ runner.temp }}/comparison/*.stdout
          if-no-files-found: error
  proof-scans:
    if: inputs.mode == 'proof-scans'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Profile native proof scans (diagnostic only)
        run: python3 scripts/seed/native_build_queue.py --output "$RUNNER_TEMP/admission.json" -- python3 scripts/seed/profile-proof-scans.py --baseline-revision db6b2f085f627b413a9bc6f80f90ab942481e6b2 --output "$RUNNER_TEMP/proof-scans" --seconds 240
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-proof-scans
          path: |
            ${{ runner.temp }}/admission.json
            ${{ runner.temp }}/proof-scans/observations.json
            ${{ runner.temp }}/proof-scans/events.jsonl
            ${{ runner.temp }}/proof-scans/*.stderr
            ${{ runner.temp }}/proof-scans/*.stdout
          if-no-files-found: error
  measure:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'controller'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Profile observer and scheduler controls
        run: python3 scripts/seed/test_native_iteration.py -v
      - name: Current source and pinned images
        run: python3 scripts/seed/check-native-identities.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: one-compiler-receipt
          run-id: ${{ inputs.derivation-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/one
      - name: Fresh native x86 fixed point and roles from source-identical derivation
        run: python3 scripts/seed/check-complete-x86.py --compiler "$RUNNER_TEMP/one/F-x86_64.elf" --arm-proof "$RUNNER_TEMP/one/one-compiler.json" --output "$RUNNER_TEMP/complete"
      - name: Early native controller controls without completing the expensive rebuild
        run: python3 scripts/seed/check-native-cdci.py --stage preflight --complete "$RUNNER_TEMP/complete" --output "$RUNNER_TEMP/local-cdci"
      - name: Isolated full controller with external phase observations
        run: python3 scripts/seed/native_build_queue.py --output "$RUNNER_TEMP/admission.json" -- python3 scripts/seed/check-native-cdci.py --complete "$RUNNER_TEMP/complete" --output "$RUNNER_TEMP/native-cdci"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-controller-diagnostic
          path: |
            ${{ runner.temp }}/one/one-compiler.json
            ${{ runner.temp }}/complete/complete-x86.json
            ${{ runner.temp }}/complete/calls.json
            ${{ runner.temp }}/local-cdci/*.json
            ${{ runner.temp }}/admission.json
            ${{ runner.temp }}/native-cdci/*.json
            ${{ runner.temp }}/native-cdci/positive/*.receipt
          if-no-files-found: warn

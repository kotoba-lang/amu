name: test
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/seed/test-preserved-verification.py
      - run: python3 docs/evidence/native-selfhost-paused-20261012/verify.py
      - run: python3 scripts/seed/build-adopted.py --verify-only
      - run: python3 scripts/seed/build-adopted.py --receipt seed/preserved-20261012/adoption.json --verify-only
  policy-native-correctness:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/seed/verify-preserved-integration.py --output "$RUNNER_TEMP/preserved-correctness"
      - run: python3 scripts/seed/verify-preserved-integration.py --main --output "$RUNNER_TEMP/main-correctness"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: paused-native-policy-correctness
          path: |
            ${{ runner.temp }}/preserved-correctness/host
            ${{ runner.temp }}/preserved-correctness/report.json
            ${{ runner.temp }}/main-correctness/host
            ${{ runner.temp }}/main-correctness/report.json
  loader-source-bound-fuzz:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        scope: [public, trusted]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/seed/verify-loader-fuzz.py ${{ matrix.scope == 'trusted' && '--trusted-bootstrap' || '' }} --output "$RUNNER_TEMP/loader-fuzz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: loader-fuzz-${{ matrix.runner }}-${{ matrix.scope }}
          path: ${{ runner.temp }}/loader-fuzz
  adopted-seed-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/seed/build-adopted.py --verify-only
  adopted-seed-native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/seed/build-adopted.py --output "$RUNNER_TEMP/adopted-native-selfbuild" --generations 2
      - run: python3 scripts/seed/check-bounded-lookup.py --selfbuild-output "$RUNNER_TEMP/adopted-native-selfbuild"
      - run: python3 scripts/seed/check-certified-scalar-calls.py --selfbuild-output "$RUNNER_TEMP/adopted-native-selfbuild"
      - run: python3 scripts/seed/check-twoarg-comparisons.py --selfbuild-output "$RUNNER_TEMP/adopted-native-selfbuild"
      - run: python3 scripts/seed/check-sequential-scan.py --selfbuild-output "$RUNNER_TEMP/adopted-native-selfbuild"
      - run: python3 scripts/seed/check-positive-quotient.py --selfbuild-output "$RUNNER_TEMP/adopted-native-selfbuild"
      - run: python3 scripts/seed/check-positive-quotient-proof.py --selfbuild-output "$RUNNER_TEMP/adopted-native-selfbuild"
      - run: python3 scripts/seed/check-mask-direct-source.py --selfbuild-output "$RUNNER_TEMP/adopted-native-selfbuild"
      - run: python3 scripts/seed/check-prepaid-fuel-reuse.py --selfbuild-output "$RUNNER_TEMP/adopted-native-selfbuild"
      - run: python3 scripts/seed/check-nonzero-guard-charge.py --selfbuild-output "$RUNNER_TEMP/adopted-native-selfbuild"
      - run: python3 scripts/seed/check-adjacent-fuel-reload.py --selfbuild-output "$RUNNER_TEMP/adopted-native-selfbuild"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: adopted-native-regression-evidence
          path: ${{ runner.temp }}/adopted-native-selfbuild
  nbb-engine-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.12.0"
          cache: npm
      - run: npm ci
      - run: npm run test-nbb-engine
  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.12.0"
          cache: npm
      - run: npm ci
      - run: npm run test-default-target
      - run: npm run test-nbb-io
      - run: npm run test-windows-profile
  android-ndk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.12.0"
          cache: npm
      - run: npm ci
      - run: npm run test-android-ndk
  server-kind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.12.0"
          cache: npm
      - run: npm ci
      # #775: the ubuntu-24.04 runner image (20260831.293+) now ships Kind
      # 0.33.0, but scripts/kind-server-conformance.cljk pins kind v0.32.0
      # exactly. Install the pinned binary ahead of it on PATH.
      - name: Install pinned kind v0.32.0
        run: |
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version
      - run: npm run test-kind-server
  # This compiler is itself a library, and its own suite passing is not enough.
  # A KIR-shape change can be green here and leave a downstream repo's shipped
  # artifacts stale. That is not hypothetical: #455 renamed the `binding-some`
  # temporary, every check here passed, and kotoba-lang/murakumo's drift gate
  # went to 16 failures against this main until it regenerated.
  #
  # The libraries below this one already carry a `consumer-conformance` job that
  # runs THIS repo against their checkout. This is the same idea one level up.
  #
  # murakumo's oracle-authority suite is the right downstream gate: it compiles
  # every `kotoba/*_core.kotoba` live and compares it byte for byte with the
  # shipped KIR, so it fails exactly when this repo changes the KIR a consumer
  # has already frozen.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.12.0"
          cache: npm
      - uses: bytecodealliance/actions/wasm-tools/setup@7ee36389ead2e51422087f820a7e17e39811b05f # main
        with:
          # Must match kotoba.compiler.wasm-tools/version -- the default is
          # `latest`, which broke every test run when 1.254.0 shipped
          # (2026-07-20): assert-version! rightly refuses an unpinned binary.
          version: "1.243.0"
      - name: Install pinned Component composition tool
        run: cargo install --locked --version 0.10.1 wac-cli
      - run: npm ci
      # After `npm ci`: the prefetch resolves deps-lock.edn through the nbb
      # fork in node_modules (the JVM route and `clojure -P` are gone, ADR
      # 0347), so it cannot run before the install. Measured on the first
      # push of that change: it ran before `npm ci`, failed on a missing
      # node_modules/nbb, and every later step reported `nbb: not found`.
      - name: Prepare pinned test dependencies with bounded transient retries
        run: node scripts/ci-dependency-prefetch.mjs --alias test
      - if: ${{ !cancelled() }}
        run: npm run test-ci-dependency-prefetch
      - if: ${{ !cancelled() }}
        run: npx nbb scripts/check-workflows.cljk
      - if: ${{ !cancelled() }}
        run: npm run test-nbb-classpath-hermetic
      - if: ${{ !cancelled() }}
        run: npm run test-jdk-free-native
      - if: ${{ !cancelled() }}
        run: npm run test-loader-file-scope
      - if: ${{ !cancelled() }}
        run: npm run test-loader-http-scope
      - if: ${{ !cancelled() }}
        name: Loader decisions (classification and generated region; the differential needs the full history)
        run: npm run test-loader-decisions-static
      - if: ${{ !cancelled() }}
        name: Export boundary codec (typed native export arguments and results against the reference)
        run: npm run test-export-boundary-codec
      - if: ${{ !cancelled() }}
        run: npm run test-policy-bound-provenance
      - if: ${{ !cancelled() }}
        run: npm run test-output-set-publisher-auth
      - if: ${{ !cancelled() }}
        run: npm run test-release
      - if: ${{ !cancelled() }}
        run: npm run test-nbb-release-and-emitters
      - if: ${{ !cancelled() }}
        run: npm run test-nbb-trust
      - if: ${{ !cancelled() }}
        run: npm run test-browser-host
      - if: ${{ !cancelled() }}
        run: npm run test-typed-value-conformance
      - if: ${{ !cancelled() }}
        run: npm run test-worker-host
      - if: ${{ !cancelled() }}
        run: npm run test-wasi-host
      - if: ${{ !cancelled() }}
        run: npm run test-wasi-service
      - if: ${{ !cancelled() }}
        run: npm run test-wasmtime
      - if: ${{ !cancelled() && matrix.os == 'macos-14' }}
        run: npm run test-ios-aot
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      - if: ${{ !cancelled() && matrix.os == 'macos-14' }}
        run: npm run test-ios-simulator
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      - if: ${{ !cancelled() }}
        run: npm run test-nbb-wasm32
      - if: ${{ !cancelled() }}
        run: npm run test-nbb-io
      - if: ${{ !cancelled() }}
        run: npm run test-compile-cache
      - if: ${{ !cancelled() }}
        run: npm run test-nbb-host-abilities
      - if: ${{ !cancelled() }}
        run: npm run test-compiler-worker
      # Omitted direct and worker compile targets are engine-neutral Kototama
      # programs. Run that contract on every OS in the matrix.
      - if: ${{ !cancelled() }}
        run: npm run test-default-target
      - if: ${{ !cancelled() }}
        run: npm run test-performance-baseline
      - if: ${{ !cancelled() }}
        run: npm run test-runtime-comparison
      - if: ${{ !cancelled() }}
        name: Test public sema consumers on the NBB host
        run: |
          npm run test-nbb-project
          npm run test-nbb-clock-transport
          npm run test-nbb-log-provider
          npm run test-nbb-http-provider
          npm run test-nbb-state-provider
          npm run test-nbb-storage-provider
          npm run test-nbb-ui-provider
          npm run test-nbb-llm-provider
          npm run test-nbb-object-provider
          npm run test-nbb-http-ingress-provider
      - if: ${{ !cancelled() }}
        name: Test canonical ability adapter on ClojureScript
        run: |
          task_classpath="$(node node_modules/nbb/cli.js --classpath src scripts/print-classpath.cljk . | tr '\n' ':')"
          npx nbb --classpath "src:resources:$task_classpath" test/nbb/value-codec.cljk
      - if: ${{ !cancelled() }}
        run: |
          printf '(defn main [] (+ 40 2))\n' > /tmp/ci.kotoba
          bin/kotoba -M compile /tmp/ci.kotoba --target x86_64 --output /tmp/ci.kexe
          bin/amu verify-output-set /tmp/ci.kexe
      - if: ${{ !cancelled() }}
        run: npx nbb scripts/sanitizer.cljk
      - if: ${{ !cancelled() }}
        run: npx nbb scripts/fuzz-native.cljk
        env:
          KOTOBA_NATIVE_FUZZ_RUNS: "20000"
      - if: ${{ !cancelled() }}
        run: npx nbb scripts/test-review-fuzz-corpus.cljk

  execution-v2:
    name: Explicit v2 target binding, admission and completion (${{ matrix.runner }})
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.12.0"
          cache: npm
      - run: npm ci
      - name: Execute generated pure Wasm, Script and bounded EVM artifacts
        run: |
          set -o pipefail
          cp=$(node bin/kbb --backend sci --classpath src scripts/print-classpath.cljk "$PWD" --alias execution-v2 | paste -sd: -)
          node bin/kbb --backend sci --config scripts/execution-v2-nbb.edn --classpath "src:$cp" scripts/test-execution-v2-targets.cljk
      - name: Execute scoped synchronous Wasm and Script providers
        run: |
          set -o pipefail
          cp=$(node bin/kbb --backend sci --classpath src scripts/print-classpath.cljk "$PWD" --alias execution-v2 | paste -sd: -)
          node bin/kbb --backend sci --config scripts/execution-v2-nbb.edn --classpath "src:$cp" scripts/test-execution-v2-providers.cljk
      - name: Execute JVM-free native artifact through the measured executor
        run: |
          set -o pipefail
          cp=$(node bin/kbb --backend sci --classpath src scripts/print-classpath.cljk "$PWD" --alias execution-v2 --alias native-run | paste -sd: -)
          node bin/kbb --backend sci --config scripts/execution-v2-nbb.edn --classpath "src:$cp" scripts/test-execution-v2-native.cljk
      - name: Native per-call lease reservation and transport faults
        run: |
          set -o pipefail
          cp=$(node bin/kbb --backend sci --classpath src scripts/print-classpath.cljk "$PWD" --alias execution-v2 --alias native-run | paste -sd: -)
          node bin/kbb --backend sci --config scripts/execution-v2-nbb.edn --classpath "src:$cp" scripts/test-native-lease-transport.cljk
          node bin/kbb --backend sci --config scripts/execution-v2-nbb.edn --classpath "src:$cp" scripts/test-execution-v2-native-providers.cljk

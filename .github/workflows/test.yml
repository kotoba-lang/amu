name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  provider-qualification:
    strategy:
      fail-fast: false
      matrix:
        backend: [wasmtime, native, cljs]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.5.1654
      - run: clojure -M -m kotoba.compiler.backend-qualification verify ${{ matrix.backend }}
  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.5.1654
      - run: npm ci
      - run: npm run test-windows-profile
  android-ndk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.5.1654
      - run: npm ci
      - run: npm run test-android-ndk
  server-kind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.5.1654
      - run: npm ci
      - run: npm run test-kind-server
  # This compiler is itself a library, and its own suite passing is not enough.
  # A KIR-shape change can be green here and leave a downstream repo's shipped
  # artifacts stale. That is not hypothetical: #455 renamed the `binding-some`
  # temporary, every check here passed, and kotoba-lang/murakumo's drift gate
  # went to 16 failures against this main until it regenerated.
  #
  # The libraries below this one already carry a `consumer-conformance` job that
  # runs THIS repo against their checkout. This is the same idea one level up.
  #
  # murakumo's oracle-authority suite is the right downstream gate: it compiles
  # every `kotoba/*_core.kotoba` live and compares it byte for byte with the
  # shipped KIR, so it fails exactly when this repo changes the KIR a consumer
  # has already frozen.
  downstream-murakumo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: compiler
      - name: Check out the consumer
        run: git clone --depth 1 https://github.com/kotoba-lang/murakumo murakumo
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.5.1654
      - name: murakumo KIR drift gate against this checkout
        working-directory: murakumo
        run: |
          # The consumer intentionally pins an older runtime KIR and ABI for
          # its shipped artifacts.  This gate compiles against this compiler
          # checkout, so its direct dependency closure must win as a unit;
          # otherwise tools.deps selects murakumo's older KIR and the current
          # kotoba-wasm cannot even load kotoba.kir.descriptor.
          clojure -Sdeps "{:aliases {:dep {:override-deps {io.github.kotoba-lang/compiler {:local/root \"../compiler\"} io.github.kotoba-lang/kotoba-kir {:git/url \"https://github.com/kotoba-lang/kotoba-kir.git\" :git/sha \"03222197b9729819aef0ae6a0b83d9b990d212de\"} io.github.kotoba-lang/abi {:git/url \"https://github.com/kotoba-lang/abi.git\" :git/sha \"4172242a524c8ab88e4b7036e30ae492b46fc484\"}}}}}" \
            -M:test:dep -n murakumo.kotoba-oracle-authority-test

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.12.0"
          cache: npm
      - uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.5.1654
      - uses: bytecodealliance/actions/wasm-tools/setup@7ee36389ead2e51422087f820a7e17e39811b05f # main
        with:
          # Must match kotoba.compiler.wasm-tools/version -- the default is
          # `latest`, which broke every test run when 1.254.0 shipped
          # (2026-07-20): assert-version! rightly refuses an unpinned binary.
          version: "1.243.0"
      - name: Install pinned Component composition tool
        run: cargo install --locked --version 0.10.1 wac-cli
      - run: npm ci
      - run: npx nbb scripts/check-workflows.cljs
      - run: npm run test-browser-host
      - run: npm run test-worker-host
      - run: npm run test-wasi-host
      - run: npm run test-wasi-service
      - run: npm run test-release
      - run: npm run test-wasmtime
      - if: matrix.os == 'macos-14'
        run: npm run test-ios-aot
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      - if: matrix.os == 'macos-14'
        run: npm run test-ios-simulator
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      - run: clojure -M:test
        env:
          KOTOBA_FUZZ_SEED: "5426643073673934426"
          KOTOBA_FUZZ_CASES: "1000"
      - run: npm run test-nbb-wasm32
      - name: Test canonical ability adapter on ClojureScript
        run: |
          task_classpath="$(clojure -Spath)"
          npx nbb --classpath "$task_classpath" test/nbb/value-codec.cljs
      - run: |
          printf '(defn main [] (+ 40 2))\n' > /tmp/ci.kotoba
          bin/kotoba -M compile /tmp/ci.kotoba --target x86_64 --output /tmp/ci.kexe
          bin/kotoba -M verify /tmp/ci.kexe
      - run: npx nbb scripts/conformance.cljs
      - run: npx nbb scripts/sanitizer.cljs
      - run: npx nbb scripts/fuzz-native.cljs
        env:
          KOTOBA_NATIVE_FUZZ_RUNS: "20000"
      - run: npx nbb scripts/test-review-fuzz-corpus.cljs

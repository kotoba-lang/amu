name: native-definition-graph
# Shared sparse traversal is exercised by the identity/object gates as well.
# This whole-source call graph is not the checked-KIR/DefCID/cache bridge.
on:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  pull_request:
    paths:
      - "seed/**"
      - "bin/amu-linux-x86_64"
      - "native-product.json"
      - "scripts/seed/check-definition-graph-native.py"
      - "scripts/seed/check-token-headroom-native.py"
      - ".github/workflows/native-definition-graph.yml"
  push:
    branches: [main]
    paths:
      - "seed/**"
      - "bin/amu-linux-x86_64"
      - "native-product.json"
      - "scripts/seed/check-definition-graph-native.py"
      - "scripts/seed/check-token-headroom-native.py"
      - ".github/workflows/native-definition-graph.yml"
permissions:
  contents: read
concurrency:
  group: native-definition-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  graph:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            isa: arm64
            compiler: seed/bootstrap/aarch64-linux-static-root.elf
          - runner: ubuntu-24.04
            isa: x86_64
            compiler: bin/amu-linux-x86_64
    runs-on: ${{ matrix.runner == 'ubuntu-24.04-arm' && (contains(fromJSON('["selfhosted","selfhosted-arm"]'), vars.AMU_RUNNER_PROFILE) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'amu-linux-arm64' || matrix.runner) || (vars.AMU_RUNNER_PROFILE == 'selfhosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'amu-linux-x86_64' || matrix.runner) }}  # amu-runner: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: gate
        uses: ./.github/actions/ci-gate
        with:
          job: native-definition-graph-graph-${{ matrix.runner }}
      - name: Verify current compiler source and image pins
        if: steps.gate.outputs.skip != 'true'
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts/seed basilisp run scripts/seed/check-native-identities.cljc --
      - name: Native sparse graph, complete compiler input and executed mutants
        if: steps.gate.outputs.skip != 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts/seed basilisp run scripts/seed/native_build_queue.cljc --
          --phase native-definition-graph
          --slot-dir "$RUNNER_TEMP/native-build-slots"
          --output "$RUNNER_TEMP/graph-admission.json" --
          python3 scripts/seed/check-definition-graph-native.py
          --compiler "$PWD/${{ matrix.compiler }}"
          --output "$RUNNER_TEMP/definition-graph"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.gate.outputs.skip != 'true'
        with:
          name: native-definition-graph-${{ matrix.isa }}
          path: |
            ${{ runner.temp }}/definition-graph/*.json
            ${{ runner.temp }}/definition-graph/*.stdout
            ${{ runner.temp }}/definition-graph/*.stderr
            ${{ runner.temp }}/definition-graph/*.kotoba
            ${{ runner.temp }}/definition-graph/observer.py
            ${{ runner.temp }}/definition-graph/unit.elf
            ${{ runner.temp }}/definition-graph/whole-producer.elf
            ${{ runner.temp }}/graph-admission.json
          if-no-files-found: error
      - if: success() && steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/ci-save
        with:
          key: ${{ steps.gate.outputs.key }}
  headroom-shard:
    # JUN-818: sharded by table (TOK/NODE/FN are independent measurements + padding controls), then the
    # `headroom` gate job below keeps the original check name. JUN-737: exact token / read-node / function-table headroom of the largest static builds (about 100
    # compiles that stop after reading, ~10 s each on a runner), in parallel with the graph gate.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04-arm, isa: arm64, compiler: seed/bootstrap/aarch64-linux-static-root.elf, table: TOK}
          - {runner: ubuntu-24.04-arm, isa: arm64, compiler: seed/bootstrap/aarch64-linux-static-root.elf, table: NODE}
          - {runner: ubuntu-24.04-arm, isa: arm64, compiler: seed/bootstrap/aarch64-linux-static-root.elf, table: FN}
          - {runner: ubuntu-24.04, isa: x86_64, compiler: bin/amu-linux-x86_64, table: TOK}
          - {runner: ubuntu-24.04, isa: x86_64, compiler: bin/amu-linux-x86_64, table: NODE}
          - {runner: ubuntu-24.04, isa: x86_64, compiler: bin/amu-linux-x86_64, table: FN}
    name: headroom-shard (${{ matrix.isa }}, ${{ matrix.table }})
    runs-on: ${{ matrix.runner == 'ubuntu-24.04-arm' && (contains(fromJSON('["selfhosted","selfhosted-arm"]'), vars.AMU_RUNNER_PROFILE) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'amu-linux-arm64' || matrix.runner) || (vars.AMU_RUNNER_PROFILE == 'selfhosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'amu-linux-x86_64' || matrix.runner) }}  # amu-runner: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: gate
        uses: ./.github/actions/ci-gate
        with:
          job: native-definition-graph-headroom-${{ matrix.runner }}-${{ matrix.table }}
      - name: Verify current compiler source and image pins
        if: steps.gate.outputs.skip != 'true'
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts/seed basilisp run scripts/seed/check-native-identities.cljc --
      - name: Compiler table headroom of the largest static builds, with negative controls
        if: steps.gate.outputs.skip != 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts/seed basilisp run scripts/seed/native_build_queue.cljc --
          --phase native-table-headroom
          --slot-dir "$RUNNER_TEMP/native-build-slots"
          --output "$RUNNER_TEMP/table-headroom-admission.json" --
          python3 scripts/seed/check-token-headroom-native.py
          --compiler "$PWD/${{ matrix.compiler }}"
          --output "$RUNNER_TEMP/table-headroom"
          --tables "${{ matrix.table }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.gate.outputs.skip != 'true'
        with:
          name: native-table-headroom-${{ matrix.isa }}-${{ matrix.table }}
          path: |
            ${{ runner.temp }}/table-headroom/token-headroom.json
            ${{ runner.temp }}/table-headroom-admission.json
          if-no-files-found: error
      - if: success() && steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/ci-save
        with:
          key: ${{ steps.gate.outputs.key }}
  headroom:
    # Final gate: keeps the original check names `headroom (<runner>, <isa>, <compiler>)`. It fails unless
    # every table shard passed (if: always() so a failed or cancelled shard is reported, never skipped).
    needs: headroom-shard
    if: always()
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            isa: arm64
            compiler: seed/bootstrap/aarch64-linux-static-root.elf
          - runner: ubuntu-24.04
            isa: x86_64
            compiler: bin/amu-linux-x86_64
    runs-on: ${{ vars.AMU_RUNNER_PROFILE == 'selfhosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'amu-linux-x86_64' || 'ubuntu-24.04' }}  # amu-runner: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All headroom table shards passed
        env:
          RESULT: ${{ needs.headroom-shard.result }}
        run: test "$RESULT" = success

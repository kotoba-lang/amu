name: native-definition-graph
# Shared sparse traversal is exercised by the identity/object gates as well.
# This whole-source call graph is not the checked-KIR/DefCID/cache bridge.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "seed/**"
      - "bin/amu-linux-x86_64"
      - "native-product.json"
      - "scripts/seed/check-definition-graph-native.py"
      - ".github/workflows/native-definition-graph.yml"
  push:
    branches: [main]
    paths:
      - "seed/**"
      - "bin/amu-linux-x86_64"
      - "native-product.json"
      - "scripts/seed/check-definition-graph-native.py"
      - ".github/workflows/native-definition-graph.yml"
permissions:
  contents: read
concurrency:
  group: native-definition-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  graph:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            isa: arm64
            compiler: seed/bootstrap/aarch64-linux-static-root.elf
          - runner: ubuntu-latest
            isa: x86_64
            compiler: bin/amu-linux-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify current compiler source and image pins
        run: python3 scripts/seed/check-native-identities.py
      - name: Native sparse graph, complete compiler input and executed mutants
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 scripts/seed/native_build_queue.py
          --phase native-definition-graph
          --slot-dir "$RUNNER_TEMP/native-build-slots"
          --output "$RUNNER_TEMP/graph-admission.json" --
          python3 scripts/seed/check-definition-graph-native.py
          --compiler "$PWD/${{ matrix.compiler }}"
          --output "$RUNNER_TEMP/definition-graph"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-definition-graph-${{ matrix.isa }}
          path: |
            ${{ runner.temp }}/definition-graph/*.json
            ${{ runner.temp }}/definition-graph/*.stdout
            ${{ runner.temp }}/definition-graph/*.stderr
            ${{ runner.temp }}/definition-graph/*.kotoba
            ${{ runner.temp }}/definition-graph/observer.py
            ${{ runner.temp }}/definition-graph/unit.elf
            ${{ runner.temp }}/definition-graph/whole-producer.elf
            ${{ runner.temp }}/graph-admission.json
          if-no-files-found: error

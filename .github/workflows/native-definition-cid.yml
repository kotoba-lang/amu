name: native-definition-cid
# The bounded native identity codec is qualified independently before it can
# join the adopted compiler closure. It never replaces selfhost-native gates.
on:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  pull_request:
    paths:
      - "seed/03-source-sha256.kotoba"
      - "seed/04-definition-cid.kotoba"
      - "seed/tests/native-definition-cid.kotoba"
      - "seed/tests/definition-cid-vectors.json"
      - "seed/bootstrap/**"
      - "bin/amu-linux-x86_64"
      - "scripts/seed/check-definition-cid-native.py"
      - "scripts/seed/macos_native_image.py"
      - ".github/workflows/native-definition-cid.yml"
  push:
    branches: [main]
    paths:
      - "seed/03-source-sha256.kotoba"
      - "seed/04-definition-cid.kotoba"
      - "seed/tests/native-definition-cid.kotoba"
      - "seed/tests/definition-cid-vectors.json"
      - "seed/bootstrap/**"
      - "bin/amu-linux-x86_64"
      - "scripts/seed/check-definition-cid-native.py"
      - "scripts/seed/macos_native_image.py"
      - ".github/workflows/native-definition-cid.yml"
permissions:
  contents: read
concurrency:
  group: native-definition-cid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  codec:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            isa: arm64
            compiler: seed/bootstrap/aarch64-linux-static-root.elf
          - runner: ubuntu-24.04
            isa: x86_64
            compiler: bin/amu-linux-x86_64
    runs-on: ${{ matrix.runner == 'ubuntu-24.04-arm' && (contains(fromJSON('["selfhosted","selfhosted-arm"]'), vars.AMU_RUNNER_PROFILE) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'amu-linux-arm64' || matrix.runner) || (vars.AMU_RUNNER_PROFILE == 'selfhosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'amu-linux-x86_64' || matrix.runner) }}  # amu-runner: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: gate
        uses: ./.github/actions/ci-gate
        with:
          job: native-definition-cid-codec-${{ matrix.runner }}
      - name: Verify adopted source and compiler pins
        if: steps.gate.outputs.skip != 'true'
        run: python3 scripts/seed/check-native-identities.py
      - name: Native payload-v2 encoding, CIDs and refusal controls
        if: steps.gate.outputs.skip != 'true'
        run: >-
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts/seed basilisp run scripts/seed/native_build_queue.cljc --
          --slot-dir "$RUNNER_TEMP/native-build-slots" --
          python3 scripts/seed/check-definition-cid-native.py
          --compiler "$PWD/${{ matrix.compiler }}"
          --output "$RUNNER_TEMP/definition-cid"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.gate.outputs.skip != 'true'
        with:
          name: definition-cid-${{ matrix.isa }}
          path: ${{ runner.temp }}/definition-cid
          if-no-files-found: warn
      - if: success() && steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/ci-save
        with:
          key: ${{ steps.gate.outputs.key }}

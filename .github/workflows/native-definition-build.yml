name: native-definition-build
# Independent bounded object/relink qualification. The adopted compiler,
# original identity oracles and uncached main/full gates remain required.
on:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  pull_request:
    paths:
      - "seed/**"
      - "bin/amu-linux-x86_64"
      - "native-product.json"
      - "scripts/seed/check-definition-build-native.py"
      - "scripts/seed/sealed_image.py"
      - "scripts/seed/verified_attestation.py"
      - "scripts/seed/test_verified_attestation.py"
      - ".github/workflows/native-definition-build.yml"
  push:
    branches: [main]
    paths:
      - "seed/**"
      - "bin/amu-linux-x86_64"
      - "native-product.json"
      - "scripts/seed/check-definition-build-native.py"
      - "scripts/seed/sealed_image.py"
      - "scripts/seed/verified_attestation.py"
      - "scripts/seed/test_verified_attestation.py"
      - ".github/workflows/native-definition-build.yml"
permissions:
  contents: read
concurrency:
  group: native-definition-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  objects:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            isa: arm64
            compiler: seed/bootstrap/aarch64-linux-static-root.elf
          - runner: ubuntu-24.04
            isa: x86_64
            compiler: bin/amu-linux-x86_64
    runs-on: ${{ matrix.runner == 'ubuntu-24.04-arm' && (contains(fromJSON('["selfhosted","selfhosted-arm"]'), vars.AMU_RUNNER_PROFILE) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'amu-linux-arm64' || matrix.runner) || (vars.AMU_RUNNER_PROFILE == 'selfhosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'amu-linux-x86_64' || matrix.runner) }}  # amu-runner: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: gate
        uses: ./.github/actions/ci-gate
        with:
          job: native-definition-build-objects-${{ matrix.runner }}
      - name: Verify adopted source and compiler pins
        if: steps.gate.outputs.skip != 'true'
        run: python3 scripts/seed/check-native-identities.py
      - name: Verify provenance policy negative controls (not artifact qualification)
        if: steps.gate.outputs.skip != 'true'
        run: python3 scripts/seed/test_verified_attestation.py -v
      - name: Native object storage, symbolic relink, fresh refusals and executed mutants
        if: steps.gate.outputs.skip != 'true'
        run: >-
          python3 scripts/seed/native_build_queue.py
          --slot-dir "$RUNNER_TEMP/native-build-slots" --
          python3 scripts/seed/check-definition-build-native.py
          --compiler "$PWD/${{ matrix.compiler }}"
          --output "$RUNNER_TEMP/definition-build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.gate.outputs.skip != 'true'
        with:
          name: definition-build-${{ matrix.isa }}
          path: |
            ${{ runner.temp }}/definition-build/observations.json
            ${{ runner.temp }}/definition-build/*.stdout
            ${{ runner.temp }}/definition-build/*.stderr
          if-no-files-found: warn
      - if: success() && steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/ci-save
        with:
          key: ${{ steps.gate.outputs.key }}

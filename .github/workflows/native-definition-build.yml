name: native-definition-build
# Independent bounded object/relink qualification. The adopted compiler,
# original identity oracles and uncached main/full gates remain required.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "seed/**"
      - "bin/amu"
      - "scripts/seed/check-definition-build-native.py"
      - ".github/workflows/native-definition-build.yml"
  push:
    branches: [main]
    paths:
      - "seed/**"
      - "bin/amu"
      - "scripts/seed/check-definition-build-native.py"
      - ".github/workflows/native-definition-build.yml"
permissions:
  contents: read
concurrency:
  group: native-definition-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Temporary diagnostic for the unadopted merged KOTOBA-161 candidate.
  # Remove this branch-specific job before any mainline PR.
  candidate-x86-float:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/kotoba161-merged-x86-observe-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Observe unadopted candidate scalar float on x86_64 Linux
        run: >-
          python3 scripts/seed/check-x86-float-scalar-candidate.py
          --compiler "$PWD/diagnostics/kotoba161-merged/F-x86_64.elf"
          --compiler-sha256 f36948f44c75f53e28d5c7527e22eb831cb4c188f9413ac69b30c442e7e2aadd
          --cross-receipt "$PWD/diagnostics/kotoba161-merged/cross.json"
          --cross-sha256 141c74b765561d79b72e201545f4947f4004b7598c9b4bda6cb1c0e162eb21d0
          --output "$RUNNER_TEMP/x86-float-candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: x86-float-candidate
          path: ${{ runner.temp }}/x86-float-candidate/
          if-no-files-found: warn
  candidate-x86-fixed-point:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/kotoba161-merged-x86-observe-20261029'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Observe unadopted x86 native compiler fixed point
        run: >-
          python3 scripts/seed/check-macos-cross-linux-native.py
          --candidate "$PWD/diagnostics/kotoba161-merged"
          --output "$RUNNER_TEMP/x86-fixed-point"
          --isa x86_64 --allow-unadopted
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: x86-merged-fixed-point
          path: |
            ${{ runner.temp }}/x86-fixed-point/native-fixed-point.json
            ${{ runner.temp }}/x86-fixed-point/F-x86_64.elf
            ${{ runner.temp }}/x86-fixed-point/F1.elf
            ${{ runner.temp }}/x86-fixed-point/F2.elf
            ${{ runner.temp }}/x86-fixed-point/S-x86_64.elf
            ${{ runner.temp }}/x86-fixed-point/S1.elf
            ${{ runner.temp }}/x86-fixed-point/S2.elf
          if-no-files-found: warn
  objects:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            isa: arm64
            compiler: seed/bootstrap/aarch64-linux-static-root.elf
          - runner: ubuntu-latest
            isa: x86_64
            compiler: bin/amu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify adopted source and compiler pins
        run: python3 scripts/seed/check-native-identities.py
      - name: Native object storage, symbolic relink, fresh refusals and executed mutants
        run: >-
          python3 scripts/seed/native_build_queue.py
          --slot-dir "$RUNNER_TEMP/native-build-slots" --
          python3 scripts/seed/check-definition-build-native.py
          --compiler "$PWD/${{ matrix.compiler }}"
          --output "$RUNNER_TEMP/definition-build"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: definition-build-${{ matrix.isa }}
          path: |
            ${{ runner.temp }}/definition-build/observations.json
            ${{ runner.temp }}/definition-build/*.stdout
            ${{ runner.temp }}/definition-build/*.stderr
          if-no-files-found: warn

name: native-capability-names
# KOTOBA-173: every admitted capability wire can be declared in a namespace and is named in E2176.
on:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  pull_request:
    paths:
      - "seed/**"
      - "scripts/seed/check-capability-declaration-names.py"
      - ".github/workflows/native-capability-names.yml"
  push:
    branches: [main]
    paths:
      - "seed/**"
      - "scripts/seed/check-capability-declaration-names.py"
      - ".github/workflows/native-capability-names.yml"
permissions:
  contents: read
concurrency:
  group: native-capability-names-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  names:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Declared capabilities check; omitted ones are refused with E2176 naming them
        run: |
          sha=$(python3 -c 'import json; print(json.load(open("seed/bootstrap/aarch64-linux-static-root.json"))["image"]["sha256"])')
          python3 scripts/seed/check-capability-declaration-names.py \
            --compiler "$PWD/seed/bootstrap/aarch64-linux-static-root.elf" --compiler-sha256 "$sha" \
            --output "$RUNNER_TEMP/capability-names"
  awai154-hosted-repin:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: gate
        uses: ./.github/actions/ci-gate
        with:
          job: awai154-hosted-repin
      - name: Run repository-native regeneration on hosted Mac
        shell: bash
        run: |
          set -uo pipefail
          test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64 || exit 2
          test "$(git rev-parse HEAD^)" = b7312ac940ff04428b0dd1484d7d2ca85fe37f81 || exit 2
          mkdir -p "$RUNNER_TEMP/awai154-result"
          git rev-parse HEAD > "$RUNNER_TEMP/awai154-result/workflow-head.txt"
          git rev-parse HEAD^ > "$RUNNER_TEMP/awai154-result/input-head.txt"
          python3 scripts/seed/repin-all-pins.py --work "$RUNNER_TEMP/awai154-work" 2>&1 | tee "$RUNNER_TEMP/awai154-result/repin.log"
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > "$RUNNER_TEMP/awai154-result/exit-code.txt"
          git status --short > "$RUNNER_TEMP/awai154-result/status.txt"
          git diff --binary HEAD -- . ':(exclude).github/workflows/native-capability-names.yml' > "$RUNNER_TEMP/awai154-result/generated.patch"
          exit "$result"
      - name: Upload regeneration evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: awai154-hosted-repin
          path: ${{ runner.temp }}/awai154-result/
          if-no-files-found: warn
          retention-days: 3

name: native-capability-names
# KOTOBA-173: every admitted capability wire can be declared in a namespace and is named in E2176.
on:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  pull_request:
    paths:
      - "seed/**"
      - "scripts/seed/check-capability-declaration-names.cljc"
      - ".github/workflows/native-capability-names.yml"
  push:
    branches: [main]
    paths:
      - "seed/**"
      - "scripts/seed/check-capability-declaration-names.cljc"
      - ".github/workflows/native-capability-names.yml"
permissions:
  contents: read
concurrency:
  group: native-capability-names-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  names:
    runs-on: ${{ contains(fromJSON('["selfhosted","selfhosted-arm"]'), vars.AMU_RUNNER_PROFILE) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'amu-linux-arm64' || 'ubuntu-24.04-arm' }}  # amu-runner: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Basilisp (pinned) for the .cljc scripts
        run: |
          python3 -m venv "$RUNNER_TEMP/basilisp-venv"
          "$RUNNER_TEMP/basilisp-venv/bin/pip" install --quiet basilisp==0.5.1 pytest
          echo "$RUNNER_TEMP/basilisp-venv/bin" >> "$GITHUB_PATH"
      - name: Declared capabilities check; omitted ones are refused with E2176 naming them
        run: |
          sha=$(python3 -c 'import json; print(json.load(open("seed/bootstrap/aarch64-linux-static-root.json"))["image"]["sha256"])')
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts/seed basilisp run scripts/seed/check-capability-declaration-names.cljc -- \
            --compiler "$PWD/seed/bootstrap/aarch64-linux-static-root.elf" --compiler-sha256 "$sha" \
            --output "$RUNNER_TEMP/capability-names"

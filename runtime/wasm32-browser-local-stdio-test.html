<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' file:; worker-src blob:; connect-src 'none'">
<title>kotoba-pending</title><pre id="results"></pre>
<script src="wasm32-browser-static-host.js"></script><script src="runs.js"></script>
<script>
"use strict";
(async () => {
  const bytes = Uint8Array.from(atob(window.KOTOBA_WASM), c => c.charCodeAt(0));
  const outputBytes = Uint8Array.from(atob(window.KOTOBA_OUTPUT_WASM), c => c.charCodeAt(0));
  const readBytes = Uint8Array.from(atob(window.KOTOBA_READ_WASM), c => c.charCodeAt(0));
  const brokerBytes = Uint8Array.from(atob(window.KOTOBA_BROKER_WASM), c => c.charCodeAt(0));
  const source = "(" + kotobaWasm32BrowserStaticHost.toString() + ")()";
  async function one(name, options) {
    const prefix = options.noJspi ? 'Object.defineProperty(WebAssembly,"Suspending",{value:undefined,configurable:true});' : '';
    const url = URL.createObjectURL(new Blob([prefix + source], {type: "text/javascript"}));
    const events = [], replies = (options.replies || []).slice();
    return await new Promise(resolve => {
      const worker = new Worker(url);
      const timer = setTimeout(() => finish({timeout:true}), 20000);
      function finish(result) { clearTimeout(timer); worker.terminate(); URL.revokeObjectURL(url); resolve({name, events, ...result}); }
      worker.onerror = e => finish({hostError: String(e.message)});
      worker.onmessage = e => {
        const data = e.data;
        if (data.localOutput) {
          events.push({kind:"output", fd:data.localOutput.fd, text:new TextDecoder().decode(data.localOutput.bytes)});
        } else if (data.localRead) {
          events.push({kind:"read", request:data.localRead.request});
          if (options.wrongChannel) worker.postMessage({capReply:{id:data.localRead.id,ok:true,status:200,content:"wrong"}});
          worker.postMessage({localReadReply:{id:data.localRead.id,ok:!options.refuse,content:replies.shift() ?? ""}});
        } else if (data.cap) {
          events.push({kind:"broker", wire:data.cap.wire});
          if (options.wrongChannel) worker.postMessage({localReadReply:{id:data.cap.id,ok:true,content:"wrong"}});
          worker.postMessage({capReply:{id:data.cap.id,ok:true,status:200,content:"ok"}});
        } else finish(data);
      };
      worker.postMessage({bytes:options.bytes || bytes, fuel:1000000, localStdio:options.local !== false,
                          allow:options.allow || [37,39,41], bind:options.bind || []});
    });
  }
  const results = [];
  results.push(await one("success", {replies:["😀","x",""],wrongChannel:true}));
  results.push(await one("denied", {allow:[37,39]}));
  results.push(await one("not-local", {local:false}));
  results.push(await one("no-jspi", {noJspi:true}));
  results.push(await one("conflict", {bind:[41]}));
  results.push(await one("oversized", {replies:["xy"]}));
  results.push(await one("lone-surrogate", {replies:["\ud800"]}));
  results.push(await one("read-refused", {refuse:true}));
  results.push(await one("bounded-output", {bytes:outputBytes}));
  results.push(await one("bounded-read-log", {bytes:readBytes}));
  results.push(await one("broker-isolation", {bytes:brokerBytes, local:false, allow:[37], bind:[45], wrongChannel:true}));
  document.getElementById("results").textContent = JSON.stringify({jspi:typeof WebAssembly.Suspending === "function" && typeof WebAssembly.promising === "function", results});
  document.title = "kotoba-done";
})().catch(error => { document.getElementById("results").textContent=JSON.stringify({error:String(error)}); document.title="kotoba-done"; });
</script>
